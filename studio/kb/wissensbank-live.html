{"id":"25-4","t":"اقامت موقت به دلایل فوری (انسانی یا شخصی)","law":"§ 25 Abs. 4 AufenthG","cat":"aufenthalt","k":"25 abs 4 satz 1 satz 2 vorübergehend dringende humanitäre persönliche gründe außergewöhnliche härte schule ausbildung pflege","one":"موقت، برای یک دلیل مشخص (مثلاً تمام کردن مدرسه/Ausbildung، مراقبت از عضو خانواده). پناهندگی نیست.","what":"Satz 1: اقامت موقت برای کسی که ملزم به خروج نیست، وقتی دلایل فوری انسانی یا شخصی یا منافع عمومی حضور موقتش را لازم کند. Satz 2: تمدید وقتی ترک آلمان «außergewöhnliche Härte» باشد.","who":["Satz 1: هنوز ملزم به خروج نباشد، دلیل فوری و موقت","Satz 2: اقامت قبلی + سختی فوق‌العاده"],"dur":"به اندازه‌ی دلیل (معمولاً کوتاه، تا ۳ سال طبق § 26 Abs. 1).","ne":"§ 26 Abs. 4: ۵ سال؛ مدت پروسه‌ی پناهندگی حساب، Duldung نه. B1، LiD، ۶۰ ماه بیمه، خرج زندگی.","pass":"<span class='non'>مستقیم نه</span> (§ 10 Abs. 1 Nr. 2 StAG): اول اقامت دائم. سال‌های 25.4 برای ۵ سال حساب است؛ Gestattung برای پاسپورت نه.","travel":"<span class='yes'>سفر به کشور خود معمولاً مشکلی ندارد</span> (حمایتی نیست) با پاسپورت معتبر؛ قبل از تمام شدن کارت برگردد، بیش از ۶ ماه بیرون نماند؛ اگر اقامت به‌خاطر خطر/بیماری است، قبلش مشورت. بهتر قبل از سفر از Ausländerbehörde بپرسد.","tips":["لم‌شمل خانواده با 25.4 ممنوع است (§ 29 Abs. 3 S. 3).","ویدیوی سری اقامت‌ها: 25-4-5 (فارسی و کوردی، 11/2026)."],"src":[["§ 25 AufenthG","https://lxgesetze.de/aufenthg/25"],["§ 26 AufenthG","https://lxgesetze.de/aufenthg/26"]],"c":"19.11.2026"},

{"id":"25a","t":"اقامت برای جوان‌ها","law":"§ 25a AufenthG","cat":"aufenthalt","k":"25a jugendliche junge volljährige 27 schule eltern geschwister","one":"زیر ۲۷ سال، ۱۲ ماه Duldung، ۳ سال آلمان، ۳ سال مدرسه یا مدرک.","what":"اقامت برای نوجوان و جوانِ خوب جاافتاده. پدر و مادر و همسر و بچه‌ها از طریق Abs. 2.","who":["حداقل ۱۲ ماه Duldung (یا اقامت § 104c) — <span class='non'>فقط Gestattung کافی نیست</span>","۳ سال بدون وقفه در آلمان (Duldung، Gestattung، اقامت)","۳ سال مدرسه‌ی موفق یا مدرک مدرسه/حرفه‌ای","درخواست قبل از ۲۷ سالگی","دروغ درباره‌ی هویت نگفته باشد"],"dur":"گرفتن کمک دولتی در زمان مدرسه، Ausbildung یا تحصیل مانع نیست.","ne":"§ 26 Abs. 4: ۵ سال اقامت، Gestattung حساب می‌شود.","pass":"۵ سال بعد از گرفتن 25a، B1، تست.","travel":"مثل اقامت‌های انسانی: با پاسپورت کشور خود.","tips":["Abs. 2: پدر و مادرِ جوان زیر ۱۸ «kann» اقامت بگیرند اگر خرجشان را با کار بدهند؛ همسر و بچه‌ی زیر ۱۸ «soll».","جرم: جریمه تا ۵۰ روز (برای جرائم مخصوص خارجی‌ها ۹۰) نادیده گرفته می‌شود."],"src":[["§ 25a AufenthG","https://lxgesetze.de/aufenthg/25a"]],"c":"21.10.2026"},
{"id":"25b","t":"اقامت برای جاافتادگی خوب (Bleiberecht)","law":"§ 25b AufenthG","cat":"aufenthalt","k":"25b bleiberecht nachhaltige integration 6 jahre 4 jahre kinder duldung","one":"۶ سال (با بچه‌ی زیر ۱۸: ۴ سال)، A2، LiD، کار، فقط با Duldung.","what":"اقامت برای کسانی که Duldung دارند و مدت طولانی اینجا خوب جا افتاده‌اند.","who":["<span class='non'>فقط با Duldung</span> (یا § 104c)؛ با Gestattung هنوز نه","۶ سال، با بچه‌ی زیر ۱۸ در خانه ۴ سال (Duldung، Gestattung، اقامت همه حساب)","A2 شفاهی، آشنایی با نظام آلمان (LiD)، تعهد به قانون اساسی","بیشترِ خرج زندگی از کار (Wohngeld مشکلی نیست)","بچه‌ها مدرسه بروند","بدون فریب درباره‌ی هویت، بدون جرم سنگین (§ 54)"],"dur":"هر بار حداکثر ۲ سال (Abs. 5)، قابل تمدید — «یک شانس» نیست.","ne":"§ 26 Abs. 4: ۵ سال اقامت؛ <span class='yes'>Gestattung حساب</span>، Duldung نه. B1، LiD، ۶۰ ماه بیمه. اداره‌ها گاهی اشتباه می‌گویند فقط سال‌های 25b حساب است.","pass":"۵ سال بعد از گرفتن 25b (Duldung و Gestattung حساب نمی‌شود). مستقیم ممکن، بدون اقامت دائم.","travel":"<span class='yes'>سفر به کشور خود مشکلی ندارد</span> (اقامت پناهندگی نیست) با پاسپورت معتبر؛ قبل از تمام شدن کارت برگردد، بیش از ۶ ماه بیرون نماند، اگر کارت نزدیک انقضاست اول تمدید.","tips":["بیماری/معلولیت/سن: شرط کار و زبان می‌افتد (Abs. 3).","Abs. 4: همسر و بچه‌های زیر ۱۸.","Abs. 6: بعد از ۳۰ ماه Beschäftigungsduldung بدون شرط ۶ سال.","تمدید را ۲ ماه زودتر بده.","سؤال: بعد از Ausbildung چرا 19d ندادند؟ 25b بهتر است چون به کار در همان رشته وابسته نیست.","آوردن خانواده از خارج با 25b فقط به دلایل انسانی (§ 29 Abs. 3)."],"src":[["§ 25b AufenthG","https://lxgesetze.de/aufenthg/25b"]],"c":"21.10.2026"},
{"id":"25b-4","t":"25b برای همسر و بچه‌ها","law":"§ 25b Abs. 4 AufenthG","cat":"aufenthalt","k":"25b abs 4 ehegatte kinder familie","one":"شرط ۶ سال برای خانواده نیست؛ A2، LiD و خرج زندگی هنوز لازم.","what":"اقامت همسر و بچه‌های زیر ۱۸ِ کسی که 25b دارد، اگر با هم زندگی کنند.","who":["همسر/شریک زندگی و بچه‌ی مجرد زیر ۱۸","زندگی مشترک"],"dur":"هر بار ۲ سال.","ne":"بعد از ۵ سال اقامت با شرایط § 9 / § 26 Abs. 4.","pass":"۵ سال اقامت قانونی، B1، تست.","travel":"با پاسپورت کشور خود.","tips":["جدایی: اگر ۳ سال زندگی مشترک بوده، اقامت مستقل (§ 31).","Familiennachzug از خارج با 25b محدود است (§ 29 Abs. 3).","همسری که هنوز Gestattung دارد (پروسه‌ی پناهندگی باز): § 10 Abs. 1 — قبل از پایان پروسه فقط با «ادعای قانونی» اقامت می‌دهند، و Abs. 4 «soll» است نه ادعا. پس معمولا بعد از تمام شدن پروسه (رد یا پس‌گرفتن) از طریق § 10 Abs. 3. پس‌گرفتن درخواست فقط با وکیل.","کیس Rebar (21.10.2026): زن 25b و ۱۰+ سال آلمان، خودش Gestattung ۲ سال و ۸ ماه، B1، LiD، Festvertrag."],"src":[["§ 25b AufenthG","https://lxgesetze.de/aufenthg/25b"],["§ 31","https://lxgesetze.de/aufenthg/31"],["§ 10 AufenthG","https://www.gesetze-im-internet.de/aufenthg_2004/__10.html"]],"c":"21.10.2026"},
{"id":"16g","t":"اقامت Ausbildung برای ملزم به خروج","law":"§ 16g AufenthG","cat":"aufenthalt","k":"16g ausbildung aufenthaltserlaubnis gestattung duldung 2024 abs 6 identität","one":"از ۲۰۲۴ به‌جای Ausbildungsduldung یک اقامت واقعی.","what":"اقامت برای Ausbildung شناخته‌شده یا Helferausbildung که به آن منتهی شود، برای کسی که در پروسه‌ی پناهندگی شروع کرده یا Duldung دارد.","who":["Ausbildung واجد شرایط","هویت روشن در مهلت؛ Abs. 6: اگر همه‌ی تلاش لازم را کرده، بدون هویت روشن هم ممکن"],"dur":"برای مدت Ausbildung. کنار آن تا ۲۰ ساعت در هفته کار دیگر. درخواست تا ۷ ماه قبل از شروع.","ne":"بعد از Ausbildung و کار، از مسیر اقامت کاری.","pass":"۵ سال اقامت قانونی، B1، تست.","travel":"با پاسپورت کشور خود.","tips":["بعد از قبولی: اقامت ۲ ساله برای کار در همان رشته (Abs. 8)؛ اگر کار پیدا نکند ۶ ماه فرصت.","قطع Ausbildung: یک بار ۶ ماه برای پیدا کردن جای جدید؛ کارفرما ظرف ۲ هفته به اداره خبر می‌دهد.","بعد از ۲ سال کار در رشته: هر کاری آزاد."],"src":[["§ 16g AufenthG","https://lxgesetze.de/aufenthg/16g"]],"c":"20.10.2026"},

{"id":"28","t":"اقامت خانواده‌ی آلمانی‌ها","law":"§ 28 AufenthG","cat":"aufenthalt","k":"28 deutscher ehegatte kind deutsches kind sorgerecht vater mutter","one":"همسر آلمانی، بچه‌ی آلمانی، پدر/مادرِ بچه‌ی آلمانی. اقامت دائم بعد از ۳ سال.","what":"اقامت برای همسر، بچه‌ی زیر ۱۸، یا پدر/مادرِ دارای Sorgerecht یک آلمانی که در آلمان زندگی می‌کند.","who":["Nr. 1 همسر آلمانی (معمولاً A1)","Nr. 2 بچه‌ی مجرد زیر ۱۸ آلمانی","Nr. 3 پدر/مادر با Personensorge","بدون Sorgerecht: «kann»، اگر خانواده در آلمان با هم زندگی کنند"],"dur":"معمولاً ۳ سال.","ne":"<span class='yes'>بعد از ۳ سال</span> اگر زندگی خانوادگی ادامه دارد، بدون Ausweisungsinteresse، با آلمانی کافی (B1) (Abs. 2).","pass":"همسر آلمانی: § 9 StAG بعد از ۳ سال اقامت و ۲ سال ازدواج، با B1 و تست.","travel":"آزاد با پاسپورت خود.","tips":["جدایی: § 31 برای همسر؛ پدر/مادر با تماس واقعی با بچه اقامت را حفظ می‌کند.","بعد از ۱۸ سالگی بچه، اگر هنوز با هم زندگی می‌کنند و بچه در حال تحصیل است، تمدید (Abs. 3).","Abs. 1 S. 2: برای Nr. 2 و 3 شرط درآمد نیست؛ برای همسر «soll in der Regel» هم نیست.","NE Abs. 2: ۶۰ ماه Rentenversicherung لازم نیست. طبق حکم BVerwG شرط عمومی درآمد (§ 5 Abs. 1 Nr. 1) معمولا اعمال می‌شود؛ استثنا اگر کمبود فقط به‌خاطر اعضای آلمانی خانواده باشد. زمان ویزای ملی داخل آلمان ممکن است حساب شود.","جدایی همسر: بعد از ۳ سال زندگی مشترک در آلمان اقامت مستقل § 31.","درخواست ویدیو: کامنت‌های فارسی (Blume25o) و کوردی (Ahmed Agha). اسکریپت فارسی v7/p28.txt (22.10.2026).","سفر به کشور خود (DM 18.11.2026): 28 Abs. 1 پناهندگی نیست، پس سفر مشکلی ندارد؛ پاسپورت معتبر، قبل از تمام شدن کارت برگردد، بیش از ۶ ماه بیرون نماند (§ 51 Abs. 1 Nr. 7)، اگر کارت نزدیک انقضاست اول تمدید."],"src":[["§ 28 AufenthG","https://lxgesetze.de/aufenthg/28"],["Anwalt Diedrich: NE § 28 Abs. 2","https://www.anwalt-diedrich.de/?p=289"],["§ 9 StAG","https://lxgesetze.de/stag/9"]],"c":"19.11.2026"},
{"id":"31","t":"اقامت مستقل بعد از جدایی","law":"§ 31 AufenthG","cat":"aufenthalt","k":"31 trennung scheidung eigenständiges aufenthaltsrecht häusliche gewalt härtefall","one":"۳ سال زندگی مشترک در آلمان → اقامت مستقل. خشونت خانگی: استثنا.","what":"اقامت همسر بعد از پایان زندگی مشترک، مستقل از همسر سابق.","who":["حداقل ۳ سال زندگی مشترک قانونی در آلمان","یا فوت همسر","Härtefall (Abs. 2): مثلاً خشونت خانگی؛ شرط ۳ سال می‌افتد"],"dur":"اول ۱ سال تمدید. گرفتن Grundsicherungsgeld معمولاً مانع نیست (Abs. 4).","ne":"Abs. 3: اگر همسر سابق NE دارد و خرج را می‌دهد، ممکن؛ در غیر این صورت طبق § 9.","pass":"طبق شرایط کلی § 10 StAG.","travel":"—","tips":["موضوع حساس: در لایو به Migrationsberatung یا Frauenberatungsstelle ارجاع بده.","کسی نباید از ترس اقامت در خشونت بماند.","فقط برای کسی که اقامتش وابسته به همسر است (لم‌شمل § 30، همسر آلمانی § 28 از طریق § 28 Abs. 3)، نه کسی که خودش پناهندگی/اقامت مستقل دارد.","Abs. 1 Nr. 2: فوت همسر در زمان زندگی مشترک هم همین حق را می‌دهد.","Abs. 2 besondere Härte: ازدواج زیر سن، آسیب جدی با برگشت، «Unzumutbarkeit» ادامه‌ی ازدواج — <span class='yes'>به‌خصوص قربانی خشونت خانگی</span>؛ مصلحت بچه هم حساب است. مستندسازی: گزارش پلیس، نامه‌ی پزشک، Frauenhaus.","Abs. 4: گرفتن SGB II/XII معمولا مانع تمدید نیست؛ استثنا اگر خودش مقصر نیاز باشد (Abs. 2 S. 4).","Abs. 1a: Blaue Karte با ۱ سال قبلی در کشور دیگر EU → ۲ سال کافی.","Hilfetelefon Gewalt gegen Frauen: 116 016، رایگان، ۲۴ ساعته، ناشناس، ۱۸ زبان با مترجم (BMBFSFJ).","اسکریپت فارسی v7/p31.txt (23.10.2026)."],"src":[["§ 31 AufenthG (Stand 22.07.2026)","https://lxgesetze.de/aufenthg/31"],["BMBFSFJ Hilfetelefon","https://www.bmbfsfj.bund.de/bmbfsfj/themen/gleichstellung/frauen-vor-gewalt-schuetzen/hilfe-und-vernetzung/hilfe-und-beratung-bei-gewalt-80640"]],"c":"23.10.2026"},
{"id":"24","t":"پناهنده‌های اوکراین","law":"§ 24 AufenthG","cat":"aufenthalt","k":"24 ukraine vorübergehender schutz fortgeltung 2027 2028","one":"جدید: خودکار تا 04.03.2028 تمدید (EU 2026/1912 + 9. Änderungsverordnung UkraineAufenthÜV، Bundesrat 25.09.2026). قبلا تا 04.03.2027 بود.","what":"حمایت موقت برای فراریان جنگ اوکراین.","who":["اقامت § 24 که در 01.02.2026 هنوز معتبر بوده"],"dur":"تا 04.03.2028، kraft Verordnung، بدون درخواست و وقت. روی کارت ممکنه هنوز تاریخ قدیم باشه. پاس معتبر لازم (§ 3). مردان اوکراینی سن نظام که از 05.08.2026 تازه وارد EU شدن باید خروج قانونی نشان بدن.","ne":"تغییر به اقامت دیگر و بعد اقامت دائم.","pass":"§ 24 برای تابعیت مستقیم حساب نیست (§ 10 Abs. 1 Nr. 2 StAG).","travel":"—","tips":["تغییر ممکن: کار (§§ 18a/b، Blaue Karte)، Ausbildung (§ 16a)، کار آزاد (§ 21)، خانواده (§§ 28, 30).","قبل از ۲۰۲۸ اقدام کند، با قرارداد، فیش و مدارک.","18a/18b زبان آلمانی قانونا لازم ندارد ولی مدرک شناخته‌شده لازم. Ausbildung معمولا B1 می‌خواهد.","هشدار: کسی که § 24 را برای اقامت کاری رها کند، اگر کار از دست برود برگشت به § 24 سخت است.","کیس Hawre Jaf (21.10.2026): § 24، ۴ سال آلمان، A2."],"src":[["Landkreis Coburg 27.07.2026","https://www.landkreis-coburg.de/fileadmin/5_Leben/Integration_Auslaenderwesen/2026_07_27_Ukraine.pdf"],["EU 2026/1912","https://eur-lex.europa.eu/eli/dec_impl/2026/1912/oj/eng"],["Visaguard: bis März 2028","https://www.visaguard.berlin/post/ukraine-aufenthaltserlaubnis-nach-24-aufenthg-automatisch-bis-märz-2028-verlängert"]],"c":"21.10.2026"},
{"id":"22","t":"پذیرش از خارج (Ortskräfte و موارد انسانی)","law":"§ 22 S. 1 / S. 2 AufenthG","cat":"aufenthalt","k":"22 satz 1 satz 2 s1 s2 aufnahme aus dem ausland ortskräfte afghanistan politische interessen bmi","one":"بند ندارد، فقط Satz 1 و Satz 2. پاسپورت مستقیم نه.","what":"اقامت برای پذیرش از خارج. ماده‌ی ۲۲ Absatz ندارد، فقط دو جمله: روی کارت «22 S. 1» یا «22 S. 2».","who":["S. 1: دلایل بین‌المللی یا انسانی فوری — اداره «kann» (اختیاری)","S. 2: وزارت کشور (BMI) اعلام کرده پذیرش به نفع سیاسی آلمان است، مثلاً Ortskräfte افغانستان — اقامت «ist zu erteilen» (حتمی)"],"dur":"معمولاً تا ۳ سال (§ 26 Abs. 1). اجازه‌ی کار.","ne":"§ 26 Abs. 4: بعد از ۵ سال، B1، LiD، ۶۰ ماه بیمه، درآمد.","pass":"<span class='non'>مستقیم نه</span> — § 22 در لیست استثناهای § 10 Abs. 1 Nr. 2 StAG است. اول اقامت دائم، بعد تابعیت.","travel":"پناهندگی نیست، ولی پذیرش به‌خاطر خطر در کشور مبدأ بوده؛ قبل از سفر به افغانستان مشورت.","tips":["آوردن خانواده: فقط به دلایل بین‌المللی/انسانی یا منافع سیاسی (§ 29 Abs. 3) — سخت‌تر از Flüchtling.","اگر کسی گفت «22 بند ۱، ۲، ۳»: احتمالاً منظورش Satz است یا با 23 قاطی کرده؛ متن روی کارت را بپرس."],"src":[["§ 22 AufenthG","https://lxgesetze.de/aufenthg/22"],["§ 10 StAG","https://lxgesetze.de/stag/10"],["§ 29","https://lxgesetze.de/aufenthg/29"]],"c":"21.10.2026"},
{"id":"23","t":"برنامه‌های پذیرش و Resettlement","law":"§ 23 Abs. 1 / 2 / 4 AufenthG","cat":"aufenthalt","k":"23 abs 1 abs 2 abs 4 aufnahmezusage bamf bundesaufnahmeprogramm afghanistan resettlement landesaufnahme","one":"Abs. 2: Aufnahmezusage از BAMF؛ گاهی همان اول اقامت دائم؛ پاسپورت مستقیم ممکن.","what":"Abs. 1: ایالت برای گروه‌هایی از یک کشور اقامت دستور می‌دهد. Abs. 2: وزارت کشور به BAMF دستور Aufnahmezusage برای گروه‌های خاص می‌دهد (مثلاً برنامه‌ی پذیرش افغانستان). Abs. 4: Resettlement پناهجویان انتخاب‌شده.","who":["Abs. 2 و 4: Aufnahmezusage از BAMF","Abs. 2: طبق Zusage یا AE یا مستقیم NE (NE ممکن است Wohnsitzauflage داشته باشد)"],"dur":"طبق Zusage، معمولاً تا ۳ سال. Abs. 2 و 4: کار مجاز. Abs. 1: خودِ اقامت اجازه‌ی کار نمی‌دهد مگر در دستور ذکر شده باشد.","ne":"اگر AE گرفته: § 26 Abs. 4 بعد از ۵ سال. Abs. 4 (Resettlement): مسیر شبیه پناهنده‌ها.","pass":"<span class='yes'>Abs. 2 مستقیم ممکن</span> — در لیست استثناهای § 10 StAG نیست (فقط 23a). بعد از ۵ سال، B1، تست.","travel":"پناهندگی نیست، ولی پذیرش به‌خاطر خطر بوده؛ قبل از سفر به کشور مبدأ مشورت.","tips":["آوردن خانواده: Abs. 1 و 2 فقط به دلایل انسانی (§ 29 Abs. 3). Abs. 4 (Resettlement) ممتاز: درخواست ظرف ۳ ماه → بدون شرط درآمد و خانه (§ 29 Abs. 2).","فرق اصلی با 22: پاسپورت — 23 Abs. 2 مستقیم، 22 اول اقامت دائم."],"src":[["§ 23 AufenthG","https://lxgesetze.de/aufenthg/23"],["§ 10 StAG","https://lxgesetze.de/stag/10"],["§ 29","https://lxgesetze.de/aufenthg/29"]],"c":"21.10.2026"},
{"id":"ehegatte-visum","t":"همسر با ویزا آمده – تبدیل به اقامت","law":"§ 30 · § 5 Abs. 2 AufenthG","cat":"aufenthalt","k":"ehegatte ehegattennachzug visum typ d typ c besuchsvisum schwanger 30 familienzusammenführung","one":"Typ D: قبل از تمام شدن ویزا به Ausländerbehörde. Typ C: معمولاً برگشت و ویزای لم‌شمل؛ استثنا مثلاً بارداری.","what":"همسرِ کسی که اقامت دائم یا اقامت دارد با ویزا وارد شده و می‌خواهد بماند.","who":["Typ D (ویزای ملی، لم‌شمل): قبل از انقضا درخواست Aufenthaltserlaubnis § 30","Typ C (شنگن/دیدار): به طور معمول باید ویزای لم‌شمل از سفارت بگیرد؛ § 5 Abs. 2 S. 2: استثنا وقتی حق قانونی هست و برگشت غیرمنطقی است (مثلاً بارداری)"],"dur":"—","ne":"—","pass":"—","travel":"—","tips":["مدارک: پاسپورت + ویزا، عقدنامه با ترجمه، کارت اقامت همسر، Meldebescheinigung، اجاره‌نامه، ۳ فیش، بیمه‌ی درمانی، A1 (اگر لازم)، عکس.","بچه‌ای که در آلمان به دنیا می‌آید و پدر NE دارد اقامت می‌گیرد (§ 33) و به مادر کمک می‌کند.","همیشه قبل از تمام شدن ویزا درخواست بدهد. استثنای بارداری با متن قانون دقیق چک نشده — موردی است."],"src":[],"c":"21.10.2026"},
{"id":"bnpl","t":"Klarna و PayPal: Später bezahlen وام شد","law":"Verbraucherkredit (EU) 2023/2225 · §§ 491 ff. BGB","cat":"geld","k":"klarna paypal ratepay später bezahlen buy now pay later bnpl ratenkauf kredit schufa inkasso mahnung 20.11.2026 verbraucherkreditrichtlinie","one":"از 20.11.2026 بیشتر «الان بخر، بعداً پول بده» وام حساب می‌شود، حتی بدون بهره و زیر ۲۰۰ یورو.","what":"اجرای دستورالعمل جدید وام مصرفی اتحادیه‌ی اروپا در آلمان. Buy now, pay later از طریق Klarna، PayPal و مشابه زیر قوانین وام می‌رود.","who":["شامل: قسطی بدون بهره، «۳۰ روز بعد پرداخت» از طریق شرکت سوم (Klarna، PayPal، Ratepay)","معمولاً شامل نیست: فاکتور مستقیم خود فروشگاه، بدون هزینه، پرداخت تا ۵۰ روز"],"dur":"تغییرات: ۱) چک توان پرداخت (Kreditwürdigkeitsprüfung) → ممکن است رد شود. ۲) هزینه‌ها و تاریخ قسط‌ها باید واضح گفته شود؛ معمولاً ۱۴ روز حق انصراف. ۳) قبل از Inkasso باید با بدهکار کنار بیایند (مهلت یا قسط کمتر).","ne":"—","pass":"—","travel":"—","tips":["وام = بدهی: پرداخت نکنی → Mahnung → Inkasso → ورودی منفی SCHUFA → خانه گرفتن سخت.","قبل از کلیک: الان پولش رو دارم؟","اگر نمی‌تواند قسط بدهد: زود خودش پیام بدهد و درخواست مهلت/قسط کمتر کند؛ Schuldnerberatung رایگان.","ویدیوی فارسی و کوردی 18.11.2026."],"src":[["netzwelt: Ab 20. November PayPal, Ratepay, Klarna","https://www.netzwelt.de/news/259765-ab-20-november-paypal-ratepay-klarna-spaeter-bezahlen-ploetzlich-abgelehnt.html"],["EVZ: Neue EU-Regeln BNPL","https://www.evz.de/aktuelles/pressemitteilungen/eu-verbraucherkreditrichtlinie/"],["onlinemarktplatz: Verbraucherkreditgesetz 2026","https://onlinemarktplatz.de/270869/verbraucherkreditgesetz-2026/"]],"c":"19.11.2026"},
{"id":"16c-sgb2","t":"پول جاب‌سنتر برای کار شخصی","law":"§ 16c SGB II","cat":"geld","k":"16c sgb ii selbständig existenzgründung zuschuss darlehen 5000 sachgüter businessplan tragfähigkeit jobcenter gründung","one":"کمک بلاعوض تا ۵۰۰۰ یورو + وام برای وسایل کار؛ اختیاری (kann).","what":"برای بگیرندگان Grundsicherungsgeld (از 01.07.2026، قبلا Bürgergeld) که کار شخصی تمام‌وقت شروع یا ادامه می‌دهند. Abs. 1: Zuschuss (حداکثر ۵۰۰۰ یورو) و Darlehen برای Sachgüter لازم و مناسب. Abs. 2: مشاوره/Coaching برای نگه داشتن کسب‌وکار.","who":["گیرنده‌ی Grundsicherungsgeld، توانا به کار","کار شخصی تمام‌وقت (hauptberuflich)","کار سودآور باشد و نیاز به کمک را کم یا تمام کند (Abs. 3)","اقامت باید کار آزاد را اجازه بدهد — Duldung/Gestattung معمولا نه"],"dur":"یک‌باره برای خرید وسایل (دستگاه، ابزار، کامپیوتر، ماشین کار). نه برای اجاره و خرج جاری.","ne":"—","pass":"—","travel":"—","tips":["مراحل: صحبت با مشاور فیز → Businessplan با پیش‌بینی درآمد/هزینه → Tragfähigkeitsbescheinigung از fachkundige Stelle (IHK، Handwerkskammer، مشاور کسب‌وکار) → درخواست کتبی.","قبل از خرید درخواست بده؛ خرید قبلی معمولا پس داده نمی‌شود.","حق قانونی نیست (Ermessen)؛ دادگاه درخواست ۱۱۰۰۰ یورو برای ماشین را رد کرده (gegen-hartz).","همزمان ممکن: Einstiegsgeld § 16b برای کار شخصی.","کسی که ALG I می‌گیرد: برنامه‌ی جدا Gründungszuschuss از Agentur für Arbeit.","ویدیوی فارسی 22.10.2026 (اسکریپت v7/p16c.txt)."],"src":[["§ 16c SGB II","https://lxgesetze.de/sgb-ii/16c"],["Grundsicherungsgeld ab 01.07.2026","https://www.boerse-express.com/news/articles/grundsicherungsgeld-ab-juli-neue-regeln-fuer-millionen-leistungsbezieher-923007"],["gegen-hartz: Firmenauto 11.000 €","https://www.gegen-hartz.de/urteile/brgergeld-bezieher-verlangt-vom-jobcenter-11000-euro-fr-firmenauto-das-gericht-sagt-das"]],"c":"22.10.2026"},
{"id":"kiz","t":"Kinderzuschlag (کمک بچه بالای Kindergeld)","law":"§ 6a BKGG","cat":"geld","k":"kinderzuschlag kiz familienkasse 297 kindergeld wohngeld bildung teilhabe kita kiz-lotse","one":"تا ۲۹۷ یورو در ماه برای هر بچه (۲۰۲۶ بدون تغییر)، از Familienkasse.","what":"کمک ماهانه برای والدین با درآمد کم که درآمدشان برای خودشان کافیست ولی برای بچه‌ها نه.","who":["Kindergeld می‌گیرد، بچه زیر ۲۵ و در خانه","حداقل Brutto: زوج ۹۰۰ یورو، تنها ۶۰۰ یورو","درآمد + KiZ + Wohngeld باید نیاز را پوشش دهد","دارایی: بیش از ۵۵۰۰۰ یورو برای ۲ نفر + ۱۵۰۰۰ برای هر نفر اضافه = مانع","خارجی‌ها: همان حق Kindergeld لازم است"],"dur":"هر بار ۶ ماه، بعد درخواست دوباره.","ne":"—","pass":"—","travel":"—","tips":["با Wohngeld همزمان می‌شود؛ با Grundsicherungsgeld نه.","با KiZ: Bildung und Teilhabe (وسایل مدرسه، ناهار) و معافیت هزینه‌ی Kita (§ 90 Abs. 4 SGB VIII).","حساب‌گر KiZ-Lotse در سایت Familienkasse.","حتی با حذف درخواست Kindergeld از 03.2027، KiZ همچنان درخواست لازم دارد.","ویدیوی فارسی 22.10.2026 (v7/pkiz.txt)."],"src":[["Verbraucherzentrale 27.04.2026","https://www.verbraucherzentrale.de/wissen/geld-versicherungen/kredit-schulden-insolvenz/erhoehter-kinderzuschlag-ab-2024-das-muessen-sie-darueber-wissen-90968"],["Finanztip KiZ 2026","https://finanztip.de/kindergeld/kindergeldzuschlag/"]],"c":"22.10.2026"},
{"id":"besuchsvisum","t":"ویزای دیدار پدر و مادر","law":"Schengen-Visum (Typ C) · §§ 66–68 AufenthG","cat":"reise","k":"besuchsvisum schengen visum eltern besuch verpflichtungserklärung einladung reisekrankenversicherung vfs typ c","one":"تا ۹۰ روز در ۱۸۰ روز، هزینه ۹۰ یورو، درخواست در سفارت/VFS کشور مبدأ.","what":"ویزای کوتاه‌مدت شنگن برای دیدار خانواده.","who":["میزبان: دعوت‌نامه و کپی اقامت، اگر لازم Verpflichtungserklärung در Ausländerbehörde (فیش حقوق، اجاره‌نامه)، با مهر «Bonität nachgewiesen/glaubhaft gemacht»","مسافر: پاسپورت (۳ ماه بیشتر از خروج معتبر، ۲ صفحه خالی، زیر ۱۰ سال)، عکس، مدرک نسبت، بیمه‌ی مسافرتی حداقل ۳۰۰۰۰ یورو، صورت‌حساب بانکی ۳ ماه، مدرک کار/بازنشستگی، دارایی"],"dur":"حداکثر ۹۰ روز در هر ۱۸۰ روز. بررسی معمولا حدود ۱۵ روز، گاهی بیشتر. درخواست حداکثر ۶ ماه قبل.","ne":"—","pass":"—","travel":"—","tips":["بیشتر ردها: شک به برگشت (Rückkehrbereitschaft) → وابستگی در کشور مبدأ نشان داده شود (خانه، ملک، بازنشستگی، کار، بچه‌های دیگر).","صورت‌حساب بانکی حتی با Verpflichtungserklärung لازم است.","مدارک جعلی = رد و خطر منع ورود.","ویدیوی فارسی 22.10.2026 (v7/pbesuch.txt)."],"src":[["VFS Checkliste Besuch (März 2026)","https://visa.vfsglobal.com/one-pager/germany/vietnam/english/pdf/Besuch-VFS-Online-DEU-Mar-2026.pdf"],["Merkblatt Besuchsreise (Amman)","https://amman.diplo.de/blob/1681220/74df2c03282549cc49552bad5b98122e/merkblatt-besuchsreise-data.pdf"]],"c":"22.10.2026"},
{"id":"familienasyl-geas","t":"پناهندگی خانوادگی بعد از GEAS","law":"§ 26 AsylG (جدید) + Art. 23 VO (EU) 2024/1347","cat":"verfahren","k":"familienasyl familienflüchtlingsschutz 26 asylg geas art 23 status-vo qualifikationsverordnung ehegatte kinder akzessorisch","one":"Familienasyl از 12.06.2026 حذف شد. حالا هر نفر جدا بررسی می‌شود؛ اگر رد شد، به عنوان عضو خانواده (Art. 23) اقامت وابسته می‌گیرد.","what":"قبلا همسر و بچه‌ی پناهنده همان وضعیت (Familienasyl/Familienflüchtlingsschutz) را می‌گرفتند. با GEAS این حذف شد و جایش یک اقامت وابسته (akzessorisch) بعد از تأیید عضویت خانواده طبق Art. 23 Status-VO آمد.","who":["همسر/شریک ثابت و بچه‌ی زیر ۱۸ (Art. 3 Nr. 9)","خانواده باید قبل از ورود به EU وجود داشته باشد (ازدواج در آلمان حساب نیست)","برادر/خواهر مجرد زیر ۱۸ هم (Abs. 3)"],"dur":"نوع و مدت دقیق اقامت (§ 25 AufenthG) هنوز تأیید نشده — بررسی شود.","ne":"بررسی نشده.","pass":"بررسی نشده.","travel":"—","tips":["BAMF از همان موقع دیگر Familienasyl نمی‌دهد، حتی برای پرونده‌های باز قبل از 12.06.2026.","اول دلایل خود شخص بررسی می‌شود؛ اگر رد شد، همزمان Art. 23 چک می‌شود و Abschiebungsandrohung صادر نمی‌شود.","تأیید § 26 Abs. 2 در برگه‌ی جداگانه می‌آید، نه در برگه‌ی رد.","همسر کسی که 25b یا اقامت غیر پناهندگی دارد شامل این نیست.","جواب‌های قدیمی که «§ 26 AsylG همان اقامت همسر» می‌گفتند دیگر دقیق نیستند."],"src":[["§ 26 AsylG (Stand 21.07.2026)","https://lxgesetze.de/asylg/26"],["JuM BW 16.07.2026, 4. Hinweisschreiben GEAS","https://jum.baden-wuerttemberg.de/fileadmin/redaktion/m-jum/intern/PDF/Migration/Erlasse_und_Anwendungshinweise/2026/JuM_16.07.2026_Viertes_Hinweisschreiben_zur_Umsetzung_der_GEAS-Reform.pdf"]],"c":"21.10.2026"},
{"id":"familiennachzug","t":"آوردن خانواده بر اساس نوع اقامت","law":"§ 29 Abs. 2 / 3 AufenthG","cat":"aufenthalt","k":"familiennachzug 29 ehegatte kinder nachzug privilegiert humanitär ausgeschlossen","one":"ممتاز: 25.1، 25.2، 23 Abs. 4. فقط انسانی: 22، 23 Abs. 1/2، 25.3، 25a، 25b. ممنوع: 25.5، 25b Abs. 4، 25a Abs. 2.","what":"آوردن همسر و بچه‌ی زیر ۱۸ به آلمان بسته به اقامت شخص در آلمان.","who":["<span class='yes'>ممتاز (Abs. 2)</span>: 23 Abs. 4، 25 Abs. 1 و 2، NE § 26 Abs. 3 — درخواست ظرف ۳ ماه بعد از شناسایی → بدون شرط درآمد و خانه","<span class='non'>فقط دلایل انسانی (Abs. 3)</span>: § 22، § 23 Abs. 1/2، § 25 Abs. 3، § 25a Abs. 1، § 25b Abs. 1","<span class='non'>ممنوع</span>: § 25 Abs. 4، 4b، 5، § 25a Abs. 2، § 25b Abs. 4، § 104c"],"dur":"—","ne":"—","pass":"—","travel":"—","tips":["subsidiär: لم‌شمل از ۲۴.۰۷.۲۰۲۵ برای ۲ سال متوقف (Gesetz 23.07.2025)."],"src":[["§ 29 AufenthG","https://lxgesetze.de/aufenthg/29"]],"c":"21.10.2026"},
{"id":"30","t":"اقامت همسر یک خارجی (لم‌شمل)","law":"§ 29 i.V.m. § 30 Abs. 1 AufenthG","cat":"aufenthalt","k":"30 abs 1 29 ivm ehegattennachzug familiennachzug ehegatte ausländer niederlassungserlaubnis 9 abs 3 miteinbürgerung 10 abs 2 stag","one":"روی کارت: «29 IVM 30 ABS.1» = اقامت همسرِ یک خارجی. دائم بعد از ۵ سال؛ ۶۰ ماه بیمه کافیه یکی از زوج داشته باشد.","what":"اقامت برای همسری که با ویزای Familiennachzug پیش همسر خارجی‌اش آمده. «29 i.V.m.» یعنی همراه با قوانین کلی لم‌شمل (§ 29).","who":["همسر یک خارجی با اقامت مناسب (NE، Blaue Karte، Fachkraft، پناهنده و ...)","معمولاً A1، هر دو ۱۸+، خونه و درآمد (بسته به گروه معافیت دارد)"],"dur":"به اندازه‌ی اقامت همسر. اجازه‌ی کار.","ne":"§ 9: ۵ سال، B1، LiD، خرج زندگی، خانه، ۶۰ ماه بیمه. <span class='yes'>§ 9 Abs. 3: برای زن و شوهر که با هم زندگی می‌کنند، بیمه‌ی بازنشستگی و اجازه‌ی کار کافیست یکی داشته باشد</span> (از حافظه‌ی قانونی؛ متن دقیق دوباره چک شود).","pass":"§ 10 StAG: ۵ سال، B1، تست، خرج بدون SGB II/XII. § 30 در لیست استثناهای § 10 Abs. 1 Nr. 2 نیست. § 10 Abs. 2: Miteinbürgerung با همسر، حتی بدون ۵ سال (حداقل مدت عملی <span class='non'>بررسی نشده</span>).","travel":"با پاسپورت خود؛ بیش از ۶ ماه بیرون نه.","tips":["جدایی: بعد از ۳ سال زندگی مشترک در آلمان اقامت مستقل § 31 (با خشونت خانگی زودتر).","همسر آلمانی → § 28 (دائم بعد از ۳ سال)، نه § 30.","سؤال کامنت 23.10.2026: «Anmerkungen 29 IVM 30 Abs.1» شرایط دائم و پاسپورت."],"src":[["anwalt.org: Einbürgerung Ehepartner","https://www.anwalt.org/einbuergerung-ehepartner/"]],"c":"23.10.2026"},
{"id":"widerruf","t":"لغو پناهندگی (Widerruf / Entzug)","law":"§§ 73 ff. AsylG · VO (EU) 2024/1347 · § 74 AsylG","cat":"aufenthalt","k":"widerruf entzug rücknahme aberkennung schutzstatus syrer bamf anhörung klage zwei wochen 73b","one":"اول نامه‌ی بررسی + فرصت جواب (معمولاً ۱ ماه)؛ بعد تصمیم؛ Klage ظرف ۲ هفته. اخراج خودکار نیست.","what":"BAMF بررسی می‌کند آیا دلیل حمایت هنوز هست. از 12.06.2026 طبق Anerkennungs-VO و AsylverfahrensVO («Entzug»)؛ بررسی‌های شروع‌شده قبل از آن با قانون قدیم.","who":["دلایل: تغییر وضع کشور (مثلاً سوریه بعد از اسد — به‌تنهایی کافی نیست)، سفر به کشور خود (مگر دلیل اخلاقی اجباری مثل فوت؛ اطلاع قبلی § 47b AufenthG)، گرفتن حمایت کشور خود، اطلاعات غلط، جرم سنگین"],"dur":"Klage: ۲ هفته (§ 74 AsylG). در موارد عادی حق ماندن تا تصمیم دادگاه (Art. 68 AsylverfahrensVO)؛ در موارد جرم/امنیتی نه → Eilantrag ۱ هفته.","ne":"NE خودکار باطل نمی‌شود؛ اداره بررسی می‌کند (VGH BW: لغو Abschiebungsverbot به‌تنهایی دلیل لغو NE نیست). تا قطعی شدن، مثل قبل رفتار.","pass":"در طول بررسی، اثر تصمیم قبلی برای Einbürgerung متوقف (§ 73b Abs. 4 AsylG).","travel":"سفر به کشور خود = بررسی محتمل.","tips":["نامه را بی‌جواب نگذار؛ مشاوره بگیر.","اقامت‌های جایگزین: 25b، کار (18a/19c)، خانواده (28/30)؛ BAMF باید همزمان subsidiär/Abschiebungsverbot را بررسی کند.","آمار: H1/2026 برای سوری‌ها ۲۳٪ بررسی‌ها لغو (۲۰۲۵: ۳.۷٪)."],"src":[["Flüchtlingsrat BW: Widerruf (Stand 09/2026)","https://fluechtlingsrat-bw.de/grundlagen/widerruf-und-ruecknahme-des-schutzstatus/"],["§ 75 AsylG (dejure)","https://dejure.org/gesetze/AsylG/75.html"],["Ostdeutsche Zeitung 14.10.2026","https://ostdeutsche-zeitung.de/politik/bamf-syrer-schutzstatus-aberkennung-bescheide-2026-11225"]],"c":"25.10.2026"},
{"id":"36as","t":"رد سریع پناهندگی (مهلت یک هفته)","law":"§ 36 AsylG","cat":"aufenthalt","k":"36 asylg abs 2 satz 1 offensichtlich unbegründet unzulässig eilantrag 80 abs 5 vwgo eine woche asylakte klage verwaltungsgericht","one":"در نامه‌ی BAMF = پرونده جزو ردهای سریع است. فقط ۱ هفته برای Klage + Eilantrag در Verwaltungsgericht.","what":"روش رسیدگی برای ردهای «offensichtlich unbegründet» یا «unzulässig». نسخه‌ی قدیم (تا 11.06.2026): Abs. 1 مهلت خروج ۱ هفته، Abs. 2 S. 1 = BAMF کپی پرونده (Asylakte) را همراه تصمیم می‌فرستد، Abs. 3 Eilantrag ظرف ۱ هفته. نسخه‌ی جدید GEAS (از 12.06.2026): عنوان «Fälle des Art. 68 Abs. 3 VO (EU) 2024/1348»، Abs. 1 کپی پرونده، Abs. 2 Antrag § 80 Abs. 5 VwGO ظرف ۱ هفته.","who":["کسی که BAMF درخواستش را سریع رد کرده","کدام نسخه اعمال می‌شود بسته به تاریخ درخواست/تصمیم است (Übergangsrecht)"],"dur":"مهلت: ۱ هفته از تحویل نامه. شکایت به‌تنهایی جلوی اخراج را نمی‌گیرد، Eilantrag لازم است.","ne":"-","pass":"-","travel":"-","tips":["DM 23.10.2026 (Afghan girl): «§ 36 Abs. 2 Satz 1 AsylG» پرسید ولی قبولی دارد؛ جواب اول اشتباه بود. روی کارت اقامت احتمالاً § 36 Abs. 2 S. 1 AufenthG است = Nachzug sonstiger Familienangehöriger (außergewöhnliche Härte). AsylG § 36 اقامت نیست.","فوراً به وکیل یا Asylberatung؛ نامه و پاکت با تاریخ نگه داشته شود."],"src":[["mandati: § 36 AsylG (GEAS, ab 12.06.2026)","https://mandati.de/asylg-36-verfahren-bei-artikel-68-absatz-3-der-eu-verordn/"],["VG Düsseldorf 28 L 2037/24.A (alte Fassung)","https://nrwe.justiz.nrw.de/ovgs/vg_duesseldorf/j2024/28_L_2037_24_A_Beschluss_20240802.html"]],"c":"23.10.2026"},
{"id":"16b","t":"ویزا و اقامت دانشجویی","law":"§ 16b AufenthG","cat":"aufenthalt","k":"16b studium student studentenvisum visum sperrkonto uni-assist zulassung semesterbeitrag ielts testdaf dsh 140 tage 280 halbe tage 20 abs 1 jobsuche baden-württemberg","one":"Sperrkonto ۹۹۲ یورو در ماه (۱۱٬۹۰۴ در سال)، کار ۱۴۰ روز کامل یا ۲۸۰ نصف روز، ۱۸ ماه جستجوی کار بعد از درس.","what":"ویزای ملی (Typ D) و بعد اقامت برای تحصیل در دانشگاه یا Studienkolleg.","who":["پذیرش دانشگاه (Zulassung)؛ خیلی از دانشگاه‌ها از طریق uni-assist","زبان: رشته‌ی آلمانی معمولاً C1 (TestDaF/DSH)، رشته‌ی انگلیسی IELTS","مدرک باید قابل قبول باشد (anabin)؛ وگرنه Studienkolleg","تأمین مالی: Sperrkonto 2026 = ۱۱٬۹۰۴ یورو/سال (۹۹۲ یورو/ماه)","بیمه‌ی درمانی؛ دانشجویی حدود ۱۴۱–۱۴۶ یورو در ماه (TK 2026)"],"dur":"معمولاً ۱–۲ سال، تمدید تا پایان درس. کار: ۱۴۰ روز کامل یا ۲۸۰ نصف روز در سال؛ کار دانشجویی در دانشگاه جدا.","ne":"بعد از درس و کار متخصص (§ 18b) از مسیر Fachkraft؛ سال‌های تحصیل برای NE نصف حساب.","pass":"سال‌های تحصیل برای پاسپورت کامل حساب است (۵ سال، B1، تست).","travel":"آزاد با پاسپورت؛ بیش از ۶ ماه بیرون نه.","tips":["شهریه: بیشتر دانشگاه‌های دولتی ندارند، فقط Semesterbeitrag ۱۵۰–۴۰۰ یورو در ترم.","Baden-Württemberg برای غیر اروپایی‌ها ۱٬۵۰۰ یورو در ترم.","خوابگاه (Studentenwohnheim) ارزان‌ترین: حدود ۳۰۰–۴۵۰ یورو، صف دارد؛ WG گران‌تر.","بعد از درس: ۱۸ ماه اقامت جستجوی کار (§ 20 Abs. 1).","ویدیوی فارسی و کوردی 18.11.2026."],"src":[["study.eu: Sperrkonto 2026","https://www.study.eu/article/germany-blocked-bank-accounts-for-students-guide"],["TK: Beitrag Studierende 2026","https://www.tk.de/techniker/leistungen-und-mitgliedschaft/versicherung/versichert-als-studierende/haeufige-fragen-fuer-studierende/beitragshoehe-beitrag-student-kvds-2007468"]],"c":"19.11.2026"},
{"id":"16d","t":"اقامت برای شناسایی مدرک (Anerkennung)","law":"§ 16d AufenthG","cat":"aufenthalt","k":"16d anerkennung pflege krankenschwester familiennachzug","one":"برای مراحل شناسایی مدرک خارجی، مثلاً پرستاری.","what":"اقامت برای اقدامات لازم جهت شناسایی مدرک حرفه‌ای خارجی.","who":["پذیرش در دوره/امتحان Anerkennung"],"dur":"معمولاً ۱ تا ۲ سال.","ne":"بعد از Anerkennung → § 18a (Fachkraft).","pass":"طبق شرایط کلی.","travel":"—","tips":["آوردن خانواده با 16d ممکن ولی سخت (خرج کل خانواده). بعد از قبولی و § 18a آسان‌تر؛ برای همسر Fachkraft زبان لازم نیست.","معافیت زبان همسر برای خودِ 16d چک نشده.","مورد omar: سفارت گفته «مدارکت را ببر» → احتمالاً رد (نبود A1 یا درآمد ناکافی). دلیل رد را کتبی بخواهد؛ اعتراض: Klage در VG Berlin ظرف ۱ ماه؛ اغلب بهتر: درخواست جدید بعد از § 18a.","آپدیت omar (22.10.2026): نامه‌ی رد از کنسولگری اربیل به تاریخ 06.10.2026 (درخواست 22.01.2026). دلایل: ۱) مدرک A1 با وجود چند بار مهلت نداده (§ 30 Abs. 1 S. 1 Nr. 2)، ۲) Einzelfall/هارت‌فال طبق § 30 Abs. 1 S. 3 Nr. 6 نیست، ۳) Ausländerbehörde موافقت § 31 AufenthV را نداد. راه: A1 بگیرد و دوباره درخواست بدهد؛ یا بعد از § 18a همسر (امتحان 10.01.2027)؛ Klage در VG Berlin ظرف ۱ ماه از دریافت (اگر Rechtsbehelfsbelehrung ندارد ۱ سال، § 58 VwGO)، شانس کم چون A1 نداده.","درآمد لازم: عدد ثابت ندارد — Netto باید بیشتر از نیاز کل خانواده باشد (Regelbedarfe + اجاره‌ی گرم + بیمه)، بدون Jobcenter."],"src":[],"c":"20.10.2026"},
{"id":"fiktion","t":"Fiktionsbescheinigung","law":"§ 81 Abs. 3 / 4 AufenthG","cat":"verfahren","k":"fiktionsbescheinigung 81 abs 3 abs 4 verlängerung reisen","one":"Abs. 4: اقامت قدیم با همه‌ی حقوق ادامه دارد. Abs. 3: فقط اجازه‌ی ماندن.","what":"برگه‌ای که نشان می‌دهد درخواست اقامت داده شده و هنوز جواب نیامده.","who":["Abs. 4: درخواست تمدید قبل از تمام شدن اقامت","Abs. 3: اقامت قانونی بدون عنوان اقامتی"],"dur":"تا تصمیم اداره.","ne":"—","pass":"—","travel":"Abs. 4: بازگشت با پاسپورت معتبر معمولاً ممکن؛ مستقیم به آلمان پرواز کند. Abs. 3: <span class='non'>سفر نکند</span>. Flüchtling به کشور خود نه.","tips":["همیشه قبل از تمام شدن اقامت درخواست تمدید بده؛ دیرتر = این حقوق نیست."],"src":[],"c":"21.10.2026"},
{"id":"duldung","t":"انواع Duldung","law":"§§ 60a–60d AufenthG","cat":"duldung","k":"duldung aussetzung der abschiebung 60a 60b 60c 60d arten zwei wochen","one":"Duldung کوتاه ≠ دیپورت نزدیک. نوعش روی برگه (Nebenbestimmungen) نوشته.","what":"«Aussetzung der Abschiebung (Duldung) – Kein Aufenthaltstitel» روی همه‌ی Duldungها هست؛ نوعش پایین‌تر.","who":["60b: «für Personen mit ungeklärter Identität» — بدترین","60a Abs. 2: معمولی (بیماری، خانواده، نبود مدرک سفر)","60c: Ausbildungsduldung — خوب","60d: Beschäftigungsduldung — خوب","60a Abs. 1: توقف عمومی اخراج توسط ایالت، حداکثر ۳ ماه"],"dur":"معمولاً کوتاه (هفته تا ماه)؛ کوتاه بودن اغلب فقط رویه‌ی اداره است.","ne":"Duldung برای اقامت دائم حساب نمی‌شود.","pass":"Duldung برای پاسپورت حساب نمی‌شود.","travel":"<span class='non'>سفر خارج از آلمان نه.</span>","tips":["اگر نوعی نوشته نشده، معمولاً 60a معمولی است. بپرس: «Nach welcher Vorschrift wurde meine Duldung erteilt?»","راه‌های خروج: 25b، 25a، 60c→19d، 60d→25b، 16g."],"src":[["§ 60b","https://lxgesetze.de/aufenthg/60b"]],"c":"20.10.2026"},
{"id":"60b","t":"Duldung برای هویت نامشخص","law":"§ 60b AufenthG","cat":"duldung","k":"60b ungeklärte identität duldung light passbeschaffung","one":"اجازه‌ی کار نه، مدتش برای هیچ اقامتی حساب نیست.","what":"وقتی اداره فکر می‌کند شخص درباره‌ی هویت فریب داده یا برای پاسپورت همکاری نمی‌کند.","who":["روی برگه: «für Personen mit ungeklärter Identität»"],"dur":"—","ne":"مدت 60b به‌عنوان Vorduldung هم حساب نمی‌شود.","pass":"—","travel":"—","tips":["خروج: پاسپورت/مدرک هویت بیاورد یا ثابت کند همه‌ی تلاش لازم را کرده؛ بعد Duldung بدون این عبارت (Abs. 4).","برای پناهجو تا رد نهایی و برای § 60 Abs. 5/7 وظیفه‌ی پاسپورت نیست."],"src":[["§ 60b AufenthG","https://lxgesetze.de/aufenthg/60b"]],"c":"20.10.2026"},
{"id":"60c","t":"Ausbildungsduldung","law":"§ 60c AufenthG","cat":"duldung","k":"60c ausbildungsduldung ausbildung abbruch 6 monate","one":"در طول Ausbildung معمولاً دیپورت نه؛ بعدش اقامت کاری ۲ ساله.","what":"Duldung برای مدت کامل Ausbildung.","who":["Ausbildung شناخته‌شده","بدون جرم، بدون فریب هویت"],"dur":"کل مدت Ausbildung.","ne":"بعد از 19d و کار.","pass":"از زمان اقامت قانونی.","travel":"<span class='non'>نه.</span>","tips":["قطع یا اخراج از Ausbildung: یک بار Duldung ۶ ماهه برای پیدا کردن جای جدید؛ با IHK/Handwerkskammer.","از ۲۰۲۴ در بسیاری موارد § 16g (اقامت واقعی) به‌جایش."],"src":[["§ 19d","https://lxgesetze.de/aufenthg/19d"]],"c":"20.10.2026"},
{"id":"60d","t":"Beschäftigungsduldung","law":"§ 60d AufenthG","cat":"duldung","k":"60d beschäftigungsduldung arbeit 30 monate 25b abs 6 2022","one":"ورود تا 31.12.2022، ۱۲ ماه Duldung، ۱۲ ماه کار ≥۲۰ ساعت، A2 → ۳۰ ماه → 25b.","what":"Duldung ۳۰ ماهه برای کسانی که کار می‌کنند؛ همسر و بچه‌های زیر ۱۸ هم.","who":["ورود تا 31.12.2022","حداقل ۱۲ ماه Duldung (60b حساب نیست)","حداقل ۱۲ ماه کار بیمه‌دار ≥ ۲۰ ساعت در هفته","خرج زندگی ۱۲ ماه گذشته و الان از کار","آلمانی شفاهی کافی (A2)","هویت روشن (ورود ۲۰۱۷–۲۰۲۲: تا 31.12.2024) یا همه‌ی تلاش (Abs. 4)","بدون جرم عمدی؛ بچه‌ها مدرسه؛ Integrationskurs اگر موظف بوده"],"dur":"۳۰ ماه. مهلت درخواست ندارد.","ne":"بعد از 25b: § 26 Abs. 4، ۵ سال؛ Gestattung حساب، Duldung (شامل ۳۰ ماه) نه.","pass":"۵ سال بعد از گرفتن 25b.","travel":"<span class='non'>نه.</span>","tips":["بعد از ۳۰ ماه: 25b «soll» بدون شرط ۶ سال (§ 25b Abs. 6)؛ اگر Integrationskurs ممکن بوده A2 کتبی هم.","وقفه‌ی کوتاه بدون تقصیر مشکلی نیست؛ کارفرما پایان کار را ظرف ۲ هفته خبر می‌دهد.","۲–۳ ماه قبل از پایان ۳۰ ماه درخواست 25b بده.","جرم (Nr. 7): هر محکومیت برای جرم عمدی در آلمان مشکل است (مثلاً دزدی، Schwarzfahren-Strafbefehl). فقط جرم‌های مخصوص خارجی‌ها (AufenthG/AsylG، مثل ورود غیرقانونی) در حد § 32 Abs. 2 Nr. 5a BZRG (تا ۹۰ Tagessätze) نادیده. Bußgeld (Ordnungswidrigkeit) جرم نیست. جرم همسر هم حساب است.","ماه‌های کار با Duldung برای ۶۰ ماه بیمه‌ی بازنشستگی حساب است."],"src":[["§ 60d","https://lxgesetze.de/aufenthg/60d"],["§ 25b","https://lxgesetze.de/aufenthg/25b"],["asyl.net","https://www.asyl.net/themen/aufenthaltsrecht/von-der-duldung-zum-bleiberecht/die-beschaeftigungsduldung"]],"c":"21.10.2026"},
{"id":"gestattung","t":"Aufenthaltsgestattung (در پروسه‌ی پناهندگی)","law":"§ 55 AsylG","cat":"duldung","k":"gestattung aufenthaltsgestattung asylverfahren gericht klage arbeit","one":"تا پایان پرونده (BAMF/دادگاه) ادامه دارد.","what":"اجازه‌ی ماندن در طول پروسه‌ی پناهندگی، شامل دادگاه.","who":["درخواست پناهندگی"],"dur":"تا تصمیم نهایی.","ne":"برای § 26 Abs. 3 و Abs. 4 <span class='yes'>حساب می‌شود</span>.","pass":"فقط اگر بعداً Flüchtling، subsidiär یا 25 Abs. 1 شده باشد (§ 55 Abs. 3 AsylG).","travel":"<span class='non'>نه.</span>","tips":["با Gestattung: 25b و 25a هنوز نه.","Ausbildung با اجازه‌ی اداره → § 16g.","Spurwechsel فقط تا قبل از رد نهایی."],"src":[],"c":"21.10.2026"},
{"id":"spurwechsel","t":"Spurwechsel – از پناهندگی به اقامت کاری","law":"§ 10 Abs. 3 S. 5 AufenthG","cat":"duldung","k":"spurwechsel 10 abs 3 18a 18b 19c abs 2 29.03.2023 rücknahme","one":"ورود قبل از 29.03.2023، مدرک شناخته‌شده، پس گرفتن درخواست پناهندگی.","what":"تغییر از پروسه‌ی پناهندگی به اقامت متخصص بدون خروج.","who":["Gestattung، قبل از رد نهایی","ورود قبل از 29.03.2023","مدرک دانشگاهی یا حرفه‌ای (حداقل ۲ ساله، رسمی در کشور خود) + قرارداد کار مرتبط → §§ 18a, 18b, 19c Abs. 2","پس گرفتن درخواست پناهندگی (برگشت‌ناپذیر)"],"dur":"طبق اقامت کاری.","ne":"از مسیر Fachkraft.","pass":"طبق شرایط کلی.","travel":"—","tips":["مدرک دیپلم ۱۲ کلاس کافی نیست؛ دوره‌ی کوتاه آرایشگری معمولاً نه.","قبل از پس گرفتن درخواست: Migrationsberatung یا وکیل.","بعد از رد BAMF و دادگاه اول هم ممکنه اگه پرونده هنوز rechtskräftig نیست (مثلاً Antrag auf Zulassung der Berufung باز). اول اقامت را با اداره هماهنگ کن، بعد پس بگیر؛ وگرنه ausreisepflichtig.","بدون مدرک شناخته‌شده: § 19c Abs. 2 + § 6 BeschV = مدرک رسمی کشور خود + ۲ سال تجربه + حقوق بالای حد (۴۵٪ BBG) یا کارفرمای tarifgebunden.","DM 23.10.2026 (Mehdi، جوشکار، Bayern، ورود 12/2022)."],"src":[["oezkan.legal: Spurwechsel Asyl","https://oezkan.legal/spurwechsel-asyl/"]],"c":"23.10.2026"},
{"id":"dublin","t":"دوبلین / Abschiebungsanordnung","law":"§ 34a AsylG","cat":"duldung","k":"dublin 34a abschiebungsanordnung überstellung 18 monate italien litauen fingerabdruck","one":"انتقال به کشور اروپایی مسئول. بعد از تمام شدن مهلت، آلمان مسئول.","what":"دستور اخراج به کشور دیگر اتحادیه که طبق دوبلین مسئول است.","who":["انگشت/درخواست در کشور دیگر اتحادیه"],"dur":"مهلت انتقال معمولاً ۶ ماه، با «فرار» بیشتر. بعد از GEAS (06/2026) قواعد عوض شده — عدد دقیق را چک کن.","ne":"—","pass":"—","travel":"—","tips":["همیشه در آدرس در دسترس باشد و نامه‌ها را بگیرد.","اگر کشور دیگر پناهندگی داده باشد، موضوع کاملاً فرق می‌کند (unzulässig).","وکیل؛ Eilantrag معمولاً ۱ هفته."],"src":[],"c":"20.10.2026"},
{"id":"26-3","t":"اقامت دائم برای پناهنده‌ها","law":"§ 26 Abs. 3 AufenthG","cat":"ne","k":"26 abs 3 niederlassungserlaubnis flüchtling asylberechtigt 5 jahre 3 jahre c1 a2","one":"۵ سال + A2، یا ۳ سال + C1. سال‌های پروسه حساب.","what":"Niederlassungserlaubnis برای 25 Abs. 1 و 25 Abs. 2 S. 1 (Flüchtling).","who":["۵ سال اقامت، «hinreichende» آلمانی (A2)، بیشتر خرج از کار، LiD","یا ۳ سال، «beherrscht» (C1)، خرج تقریباً کامل"],"dur":"نامحدود.","ne":"—","pass":"۵ سال، B1، تست.","travel":"<span class='non'>هنوز به حمایت وابسته است؛ سفر به کشور خود → خطر لغو (§ 73b Abs. 1a AsylG، § 52 AufenthG).</span>","tips":["متن کارت «26 ABS.3 S.6 I.V.M. S.3» = اقامت دائم برای کسی که از طریق Resettlement (§ 23 Abs. 4) آمده، از مسیر سریع ۳ ساله با C1. Satz 6 می‌گوید ساتزهای ۱ تا ۵ برای 23 Abs. 4 هم هست. یعنی هنوز مثل پناهنده: سفر به کشور خود با احتیاط.","Satz 5: بچه‌هایی که زیر ۱۸ وارد شده‌ان → § 35.","۶۰ ماه بیمه‌ی بازنشستگی لازم نیست (فقط § 9 Abs. 2 Nr. 4–6, 8, 9: بدون جرم، اجازه‌ی کار، LiD، خانه). ولی «بیشتر خرج زندگی از کار» لازم → فیش حقوقی. شرط دیگر: BAMF اعلام نکرده باشد که دلیل لغو حمایت هست.","تاریخ روی کارت NE فقط اعتبار خود کارت (eAT) است؛ اقامت نامحدود، فقط کارت تعویض می‌شود.","بیماری/معلولیت: معافیت‌ها طبق § 9 Abs. 2.","راه‌حل تمیز برای سفر: پاسپورت آلمانی، تابعیت دوگانه آزاد."],"src":[["§ 26","https://lxgesetze.de/aufenthg/26"]],"c":"21.10.2026"},

{"id": "v-Klarna-PayPal-Kredit", "cat": "video", "t": "🎬 Klarna PayPal Kredit", "law": "Verbraucherkredit 2026", "k": "Klarna PayPal Kredit ", "one": "از ۲۰ نوامبر، خرید با Später bezahlen در Klarna و PayPal توی آلمان وام حساب میشه 💳", "what": "از ۲۰ نوامبر، خرید با Später bezahlen در Klarna و PayPal توی آلمان وام حساب میشه 💳\nممکنه درخواستت رد بشه، و اگه قسط عقب بیفته SCHUFAت خراب میشه.\n📌 برای دوستت بفرست.\n💬 تو تا حالا با Klarna قسطی خریدی؟\n\nمنبع: Verbraucherkreditrichtlinie (EU) 2023/2225, ab 20.11.2026", "who": [], "dur": "", "ne": "", "pass": "", "travel": "", "tips": [], "cap_ku": "لە ٢٠ی نۆڤەمبەرەوە، کڕین بە Später bezahlen لە Klarna و PayPal لە ئەڵمانیا وەک قەرز حیساب دەکرێت 💳\nلەوانەیە ڕەت بکرێیتەوە، و ئەگەر قیست دوا بکەوێت SCHUFAکەت خراپ دەبێت.\n📌 بۆ هاوڕێکەت بنێرە.\n💬 تۆ تا ئێستا بە Klarna قیستی کڕیوتە؟", "script_fa": "خرید با Klarna و PayPal از این جمعه دیگه خرید نیست. وام حساب میشه!\nو Später bezahlen دیگه برای همه امکان‌پذیر نیست.\nشاید دفعه‌ی بعد که بزنیش، فقط یه کلمه ببینی: abgelehnt.\nویدیو رو لایک کن و برای دوستت بفرست، تا ادامه‌ش رو بهت بگم.\nاز بیستم نوامبر، طبق قانون جدید آلمان، هر خرید «الان بخر، بعداً پول بده» وام حساب میشه، حتی بدون بهره، حتی زیر دویست یورو.\nفقط فاکتور مستقیم از خود فروشگاه، بدون هزینه و تا پنجاه روز، معمولاً جزوش نیست.\nحالا چی عوض میشه؟\nیک: قبلش چک می‌کنن می‌تونی پولش رو بدی یا نه، پس ممکنه رد بشی.\nدو: هزینه‌ها و تاریخ قسط‌ها باید واضح باشه، و چهارده روز حق انصراف داری.\nسه: اگه نتونستی قسطت رو بدی، باید اول باهات کنار بیان، مثلاً وقت بیشتر یا قسط کمتر.\nولی یادت باشه: وام یعنی بدهی. پرداخت نکنی، Mahnung میاد، بعد Inkasso، و ممکنه SCHUFAت خراب بشه. اون وقت حتی گرفتن خونه سخت میشه.\nپس قبل از اینکه Später bezahlen رو بزنی، از خودت بپرس: الان پولش رو دارم؟\nجزئیات بیشتر توی وب‌اپلیکیشن Wegweiser News، لینکش توی بیوئه. فالو کن که چیزی رو از دست ندی.\nتو تا حالا با Klarna قسطی خریدی؟ توی کامنت بنویس.", "script_ku": "کڕین بە Klarna و PayPal لەم هەینییەوە ئیتر کڕین نییە. قەرزە!\nو Später bezahlen ئیتر بۆ هەموو کەس ناکرێت.\nلەوانەیە جاری داهاتوو کە لێی بدەیت، تەنها یەک وشە ببینیت: abgelehnt.\nڤیدیۆکە لایک بکە و بۆ هاوڕێکەت بینێرە، تا درێژەکەیت پێ بڵێم.\nلە بیستی نۆڤەمبەرەوە، بەپێی یاسای نوێی ئەڵمانیا، هەموو کڕینێکی «ئێستا بیکڕە، دواتر پارە بدە» وەک قەرز حیساب دەکرێت، تەنانەت بێ سوود، تەنانەت لە خوار دووسەد یۆرۆ.\nتەنها فاکتۆری ڕاستەوخۆی فرۆشگا، بێ تێچوون و هەتا پەنجا ڕۆژ، زۆربەی کات تێیدا نییە.\nباشە چی دەگۆڕێت؟\nیەک: پێشتر دەپشکنن کە دەتوانیت پارەکە بدەیت یان نا، کەواتە لەوانەیە ڕەت بکرێیتەوە.\nدوو: تێچوون و ڕێکەوتی قیستەکان دەبێت ڕوون بێت، و چواردە ڕۆژ مافی پاشگەزبوونەوەت هەیە.\nسێ: ئەگەر نەتتوانی قیستەکەت بدەیت، دەبێت سەرەتا لەگەڵت ڕێک بکەون، بۆ نموونە کاتی زیاتر یان قیستی کەمتر.\nبەڵام لە بیرت بێت: قەرز واتە قەرزداری. ئەگەر پارە نەدەیت، Mahnung دێت، دواتر Inkasso، و لەوانەیە SCHUFAکەت خراپ بێت. ئەوکات تەنانەت گرتنی خانووش قورس دەبێت.\nکەواتە پێش ئەوەی Später bezahlen دابگریت، لە خۆت بپرسە: ئێستا پارەکەیم هەیە؟\nوردەکاریی زیاتر لە وێب ئەپلیکەیشنی Wegweiser News، لینکەکەی لە بایۆدایە. فۆڵۆو بکە تا هیچ شتێک لەدەست نەدەیت.\nتۆ تا ئێستا بە Klarna قیستی کڕیوتە؟ لە کۆمێنت بینووسە.", "link_fa": "", "link_ku": "", "posted": "فارسی: در صف · کوردی: در صف", "src": [], "c": "2026-11"},

{"id": "v-Reisen-26-3", "cat": "video", "t": "🎬 Reisen Teil 3 (26.3)", "law": "§ 26 Abs. 3", "k": "Reisen 26 3 Reisen Teil 3 (26.3)", "one": "ئیقامەی دائیمیت هەیە (26.3)؟ بۆچی سەفەر بۆ وڵاتەکەت هێشتا مەترسیدارە؟ ⚠️", "what": "", "who": [], "dur": "", "ne": "", "pass": "", "travel": "", "tips": [], "cap_ku": "ئیقامەی دائیمیت هەیە (26.3)؟ بۆچی سەفەر بۆ وڵاتەکەت هێشتا مەترسیدارە؟ ⚠️\n📌 سەیڤی بکە.\n💬 تۆ چ بڕیارێکت داوە؟\n\nسەرچاوە: §§ 72, 73b AsylG · § 52 AufenthG", "script_fa": "", "script_ku": "ئیقامەی دائیمیت هەیە و پێت وایە دەتوانیت بە ئازادی سەفەری وڵاتی خۆت بکەیت؟ ئاگادار بە!\nئەگەر ئەم زانیارییانە یارمەتیت دەدەن، پەیجەکە فۆڵۆ بکە و لایکێک بکە.\nئەگەر لەسەر کارتەکەت نووسرابێت sechsundzwanzig Absatz drei، ئەم ئیقامە دائیمییە لەسەر بنەمای پەنابەرییە. واتە Flüchtlingsschutz هێشتا لە پشتیەتی.\nئەگەر سەفەر بکەیت بۆ ئەو وڵاتەی کە ڕەگەزنامەکەیت هەیە، BAMF وا دادەنێت کە ئیتر پێویستت بە پاراستن نییە. ئەمە لە Paragraf dreiundsiebzig b Absatz eins a ی Asylgesetz نووسراوە.\nئەگەر پەنابەرییەکەت نەمێنێت، Ausländerbehörde دەتوانێت ئیقامە دائیمییەکەشت هەڵبوەشێنێتەوە. ئەمە لە Paragraf zweiundfünfzig ی Aufenthaltsgesetz دایە.\nتەنها یەک ئاوارتە هەیە: ئەگەر سەفەرەکە بەڕاستی زۆر پێویست بێت، بۆ نموونە نەخۆشیی قورس یان مردنی دایک یان باوک. بەڵگەکان لەگەڵ خۆت ببە، و پێش سەفەر Ausländerbehörde ئاگادار بکەرەوە.\nReiseausweisی پەنابەری، واتە پاسپۆرتە شینەکە، بۆ هەموو وڵاتێک کار دەکات، جگە لە وڵاتی خۆت.\nهەواڵێکی باش: ئەگەر Flüchtling بیت و Reiseausweisێکی دروستت هەبێت، ئیقامەکەت بە مانەوەی زیاتر لە شەش مانگ لە دەرەوە بەتاڵ نابێتەوە. ئەمە Paragraf einundfünfzig Absatz sieben ە.\nباشترین ڕێگا پاسپۆرتی ئەڵمانییە. دوای Einbürgerung، پەنابەرییەکەت بە یاسا کۆتایی دێت، و دەتوانیت بە ئازادی سەفەری وڵاتی خۆت بکەیت. لە ساڵی دوو هەزار و بیست و چوارەوە دەتوانیت ڕەگەزنامەی پێشووشت بهێڵیتەوە.\nبۆ حاڵەتی خۆت، لەگەڵ Migrationsberatung قسە بکە؛ بێ پارەیە.\nتۆ ئیقامەی دائیمیت هەیە، یان هێشتا ئیقامەی بیست و پێنجت هەیە؟ لە کۆمێنت بنووسە.", "link_fa": "", "link_ku": "", "posted": "کوردی: در صف", "src": [], "c": "2026-10-19"},

{"id": "v-Spurwechsel", "cat": "video", "t": "🎬 Spurwechsel", "law": "§ 10 Abs. 3 AufenthG", "k": "Spurwechsel Spurwechsel", "one": "چەند ساڵە چاوەڕێی BAMF دەکەیت؟ Spurwechsel ڕێگایەکە بۆ ئیقامەی کار، بەڵام زۆر ئاگاداربە! 📌", "what": "", "who": [], "dur": "", "ne": "", "pass": "", "travel": "", "tips": [], "cap_ku": "چەند ساڵە چاوەڕێی BAMF دەکەیت؟ Spurwechsel ڕێگایەکە بۆ ئیقامەی کار، بەڵام زۆر ئاگاداربە! 📌", "script_fa": "", "script_ku": "چەند ساڵە چاوەڕێی وەڵامی BAMF دەکەیت و هێشتا ئیقامەت نییە؟ ڕێگایەک هەیە بۆ ئیقامەی کار، بەڵام زۆر ئاگاداربە!\nئەگەر ئەم زانیارییانە یارمەتیت دەدەن، پەیجەکە فۆڵۆ بکە و لایکێک بکە.\nئەم ڕێگایە ناوی Spurwechsel ە. واتە داواکاریی پەنابەرییەکەت دەکێشیتەوە، و لە جیاتی ئەوە ئیقامەی کار وەردەگریت.\nئەم ڕێگایە تەنها بۆ ئەو کەسانەیە کە Aufenthaltsgestattungیان هەیە، واتە پرسی پەنابەرییەکەیان هێشتا کراوەیە. بۆ Duldung نییە، و ئەوانەی ئیقامەی بیست و پێنجیان هەیە پێویستیان پێی نییە، چونکە ئێستا مافی کاریان هەیە.\nئەمە لە Paragraf zehn Absatz drei ی Aufenthaltsgesetz دا نووسراوە.\nمەرجی یەکەم و زۆر گرنگ: دەبێت پێش بیست و نۆی مارسی دوو هەزار و بیست و سێ هاتبیتە ئەڵمانیا. ئەگەر دواتر هاتوویت، ئەم ڕێگایە بۆ تۆ نییە.\nمەرجی دووەم: داواکارییەکەت هێشتا ڕەت نەکرابێتەوە. ئەگەر بە کۆتایی ڕەتکرابێتەوە، ئیتر ناکرێت.\nمەرجی سێیەم: تەنها سێ جۆر ئیقامەی کار هەن.\nیەکەم: achtzehn a، بۆ کەسێک کە بڕوانامەی پیشەیی هەیە و لە ئەڵمانیا ناسراوە.\nدووەم: achtzehn b، بۆ کەسێک کە بڕوانامەی زانکۆی هەیە و ناسراوە.\nسێیەم: neunzehn c Absatz zwei، بۆ کەسێک کە ئەزموونی کاری زۆری هەیە و مووچەیەکی باشی هەیە.\nئەگەر ئەمە بۆ تۆ یان کەسێک کە دەیناسیت گرنگە، سەیڤی بکە و بینێرە بۆی، و لایکێکیش بکە.\nهەواڵێکی باش: هاوسەرەکەت و منداڵە بچووکەکانیشت دەتوانن لەگەڵت ئیقامە وەربگرن.\nبەڵام ئاگاداربە: کێشانەوەی داواکاریی پەنابەری ناگەڕێتەوە. ئەگەر ئیقامەی کار وەرنەگریت، لەوانەیە دەبێت ئەڵمانیا بەجێ بهێڵیت.\nبۆیە پێش هەر هەنگاوێک، یەکەم جار لەگەڵ Ausländerbehörde و Migrationsberatung قسە بکە، و دڵنیا بە کە هەموو مەرجەکانت هەیە.\nتۆ کەی هاتوویتە ئەڵمانیا؟ پێش دوو هەزار و بیست و سێ یان دواتر؟ {"id": "v-Studentenvisum", "cat": "video", "t": "🎬 Studentenvisum", "law": "§ 16b AufenthG", "k": "Studentenvisum ", "one": "ویزای دانشجویی آلمان ۲۰۲۶ 🎓", "what": "ویزای دانشجویی آلمان ۲۰۲۶ 🎓\nاپلای، Sperrkonto (ماهی ۹۹۲ یورو)، کار، خونه و هزینه‌ها، همه توی یه ویدیو.\n📌 سیو کن و بفرست.\n💬 تو می‌خوای چه رشته‌ای بخونی؟", "who": [], "dur": "", "ne": "", "pass": "", "travel": "", "tips": [], "cap_ku": "ڤیزای خوێندن لە ئەڵمانیا ٢٠٢٦ 🎓\nئەپلای، Sperrkonto (٩٩٢ € مانگانە)، کار، خانوو و تێچوونەکان، هەمووی لە یەک ڤیدیۆدا.\n📌 سەیڤی بکە و بینێرە.\n💬 تۆ دەتەوێت چ بەشێک بخوێنیت؟", "script_fa": "فکر می‌کنی درس خوندن توی آلمان مجانیه؟ نه کاملاً!\nقبل از اینکه حتی ویزا بگیری، باید حدود دوازده هزار یورو توی یه حساب بلوکه‌شده بذاری.\nویدیو رو لایک کن و برای کسی که می‌خواد بیاد آلمان بفرست، تا قدم به قدم بگم.\nقدم اول، اپلای: مدرکت باید اینجا قبول باشه، و زبان لازمه. برای رشته‌ی آلمانی معمولاً C یک، برای رشته‌ی انگلیسی IELTS.\nخیلی از دانشگاه‌ها از طریق uni-assist درخواست می‌گیرن.\nقدم دوم، ویزا: با پذیرش دانشگاه، بیمه و Sperrkonto از سفارت وقت می‌گیری. Sperrkonto الان ماهی نهصد و نود و دو یورو برای یه ساله.\nکار: سالی صد و چهل روز کامل، یا دویست و هشتاد نصف روز اجازه‌ی کار داری.\nخونه: خوابگاه دانشجویی، یعنی Studentenwohnheim، ارزون‌ترینه، حدود سیصد تا چهارصد و پنجاه یورو. ولی صف داره، پس زود درخواست بده.\nهزینه‌ها: بیشتر دانشگاه‌های دولتی شهریه ندارن، فقط Semesterbeitrag، ترمی صد و پنجاه تا چهارصد یورو. ولی Baden-Württemberg از غیر اروپایی‌ها ترمی هزار و پونصد یورو می‌گیره.\nبیمه‌ی دانشجویی هم ماهی حدود صد و چهل و پنج یورو.\nو خبر خوب: بعد از درست، هجده ماه وقت داری اینجا دنبال کار بگردی.\nجزئیات بیشتر توی وب‌اپلیکیشن Wegweiser News، لینکش توی بیوئه. فالو کن.\nتو می‌خوای چه رشته‌ای بخونی؟ توی کامنت بنویس.", "script_ku": "پێت وایە خوێندن لە ئەڵمانیا بەخۆڕاییە؟ نا، تەواو نا!\nپێش ئەوەی ڤیزاش وەربگریت، دەبێت نزیکەی دوازدە هەزار یۆرۆ لە حیسابێکی بلۆککراو دابنێیت.\nڤیدیۆکە لایک بکە و بینێرە بۆ کەسێک کە دەیەوێت بێتە ئەڵمانیا، تا هەنگاو بە هەنگاو پێت بڵێم.\nهەنگاوی یەکەم، ئەپلای: بڕوانامەک {"id": "v-22-23", "cat": "video", "t": "🎬 § 22 vs § 23 AufenthG", "law": "§ 22 / § 23 AufenthG", "k": "22 23 § 22 vs § 23 AufenthG", "one": "روی کارت اقامتت § 22 یا § 23 نوشته؟ یکی‌شون مستقیم پاسپورت آلمانی میده! فرق مهم برای افغان‌ها 📌", "what": "روی کارت اقامتت § 22 یا § 23 نوشته؟ یکی‌شون مستقیم پاسپورت آلمانی میده! فرق مهم برای افغان‌ها 📌", "who": [], "dur": "", "ne": "", "pass": "", "travel": "", "tips": [], "cap_ku": "", "script_fa": "روی کارت اقامتت نوشته Paragraf zweiundzwanzig یا Paragraf dreiundzwanzig? این دو تا اقامت یه فرق خیلی بزرگ دارن، مخصوصاً برای پاسپورت آلمانی!\nفالو کن و لایک کن، تا این اطلاعات به همه برسه.\nهر دو اقامت برای کسایی هست که آلمان خودش از خارج پذیرفته، مثلاً خیلی از افغان‌ها. یعنی پناهندگی نیست، و تو پروسه‌ی Asyl نبودی.\nParagraf zweiundzwanzig: مثلاً برای Ortskräfte، یعنی کسایی که با آلمان کار می‌کردن. روی کارت معمولاً نوشته Satz eins یا Satz zwei. این ماده بند یا Absatz نداره.\nParagraf dreiundzwanzig Absatz zwei: برای برنامه‌های پذیرش دولت، مثل Bundesaufnahmeprogramm Afghanistan. اینجا BAMF یه Aufnahmezusage میده.\nهر دو اقامت معمولاً تا سه سال داده میشه و هر دو اجازه‌ی کار دارن.\nیه نکته‌ی خیلی مهم مونده! این ویدیو رو سیو کن و لایک کن، تا فرق اصلی رو بهت بگم.\nفرق اصلی، پاسپورت آلمانی هست. با Paragraf dreiundzwanzig Absatz zwei، بعد از پنج سال می‌تونی مستقیم درخواست پاسپورت بدی، با B1، Einbürgerungstest و درآمد خودت.\nولی با Paragraf zweiundzwanzig مستقیم نمیشه. چون این اقامت توی لیست استثناهای قانون تابعیت هست. اول باید اقامت دائم بگیری، بعد پاسپورت. ولی سال‌هایی که با بیست و دو اینجا بودی، حساب میشه.\nاقامت دائم برای هر دو: بعد از پنج سال، با B1، Leben in Deutschland، شصت ماه Rentenversicherung و درآمد خودت.\nآوردن خانواده با هر دو اقامت سخته و فقط به دلایل انسانی ممکنه. و قبل از سفر به کشور خودت، حتماً مشورت کن.\nحالا تو بگو: روی کارت تو چی نوشته؟ بیست و دو یا بیست و سه؟ کامنت کن!", "script_ku": "", "link_fa": "https://www.instagram.com/reel/DfZeF4SgHf7/", "link_ku": "", "posted": "فارسی ✓", "src": [], "c": "2026-10-22"},

{"id": "v-25-2-Genf-Subsidiaer", "cat": "video", "t": "🎬 § 25 Abs. 2 subsidiärer Schutz", "law": "§ 25 Abs. 2 AufenthG", "k": "25 2 Genf Subsidiaer § 25 Abs. 2 subsidiärer Schutz", "one": "ژنو یا سوبسیدیر؟ روی کارت هر دو نوشته § 25 Abs. 2، ولی حق‌هاشون خیلی فرق داره. از روی Anmerkungen کارت و نامه‌ی BAMF بفهم کدومی 📌", "what": "ژنو یا سوبسیدیر؟ روی کارت هر دو نوشته § 25 Abs. 2، ولی حق‌هاشون خیلی فرق داره. از روی Anmerkungen کارت و نامه‌ی BAMF بفهم کدومی 📌\n\nمنبع: § 25 Abs. 2 AufenthG", "who": [], "dur": "", "ne": "", "pass": "", "travel": "", "tips": [], "cap_ku": "پەنابەری جنێڤ یان سوبسیدیێر؟ لەسەر کارتی هەردووکیان نووسراوە § 25 Abs. 2، بەڵام مافەکانیان زۆر جیاوازن. لە Anmerkungen ی کارت و نامەی BAMF بزانە کامیانیت 📌\n\nسەرچاوە: § 25 Abs. 2 AufenthG", "script_fa": "پناهنده‌ی ژنو یا سوبسیدیر؟\nروی کارت هر دو نوشته fünfundzwanzig Absatz zwei، ولی حق‌هاشون خیلی با هم فرق داره.\nبیا ببینیم تو کدومی.\nاول، از کجا بفهمی.\nکارت اقامتت رو نگاه کن.\nکنار پاراگراف اگه نوشته باشه Satz eins, erste Alternative، یعنی پناهنده‌ی ژنویی.\nاگه نوشته باشه zweite Alternative، یعنی سوبسیدیری.\nتوی نامه‌ی BAMF هم اگه نوشته باشه Flüchtlingseigenschaft، یعنی ژنو.\nاگه نوشته باشه subsidiärer Schutz، یعنی سوبسیدیر.\nفرقشون از کجا میاد؟\nپناهنده‌ی ژنو کسیه که شخصاً به خاطر دین، قومیت، نظر سیاسی یا گروه اجتماعیش تحت تعقیب بوده.\nسوبسیدیر کسیه که تعقیب شخصی رو ثابت نکرده، ولی توی کشورش خطر جدی مثل جنگ، شکنجه یا اعدام تهدیدش می‌کنه.\nیک: سفر.\nپناهنده‌ی ژنو پاس آبی می‌گیره و می‌تونه به همه‌ی کشورها جز کشور خودش سفر کنه.\nسوبسیدیر معمولاً باید پاس کشور خودش رو داشته باشه، و پاس خاکستری فقط وقتی میدن که گرفتن پاس کشورت ممکن نباشه.\nدو: آوردن خانواده.\nپناهنده‌ی ژنو اگه ظرف سه ماه درخواست بده، شرط درآمد و خونه نداره.\nبرای سوبسیدیر، آوردن خانواده تا جولای دو هزار و بیست و هفت متوقف شده، به جز موارد خیلی سخت.\nسه: اقامت دائم.\nپناهنده‌ی ژنو بعد از سه سال با زبان C eins، یا بعد از پنج سال با A zwei و کار.\nسوبسیدیر بعد از پنج سال، با شرط‌های عادی مثل B eins و کار.\nولی چند تا چیز برای هر دو یکیه: اقامت اول سه ساله.\nکار کردن کاملاً آزاده.\nسه سال اول معمولاً باید توی همون ایالتی بمونی که برات تعیین شده.\nو برای پاس آلمانی، زمان پرونده‌ی پناهندگی هم حساب میشه.\nجزئیات کامل توی وب‌اپلیکیشن Wegweiser هست.\nلینکش توی بیو.\nحالا تو بگو، ژنوی یا سوبسیدیر؟\nکامنت کن.", "script_ku": "پەنابەری جنێڤ یان سوبسیدیێر؟\nلەسەر کارتی هەردووکیان نووسراوە fünfundzwanzig Absatz zwei، بەڵام مافەکانیان زۆر جیاوازن.\nبا بزانین تۆ کامیانیت.\nسەرەتا، چۆن بزانیت.\nسەیری کارتی ئیقامەکەت بکە.\nلە تەنیشت پاراگرافەکە ئەگەر نووسرابێت Satz eins, erste Alternative، واتە پەنابەری جنێڤیت.\nئەگەر نووسرابێت zweite Alternative، واتە سوبسیدیێریت.\nلە نامەی BAMFیش ئەگەر نووسرابێت Flüchtlingseigenschaft، واتە جنێڤ.\nئەگەر نووسرابێت subsidiärer Schutz، واتە سوبسیدیێر.\nجیاوازییەکەیان لە کوێوە دێت؟\nپەنابەری جنێڤ ئەو کەسەیە کە بە شێوەی کەسی لەبەر ئایین، نەتەوە، بیروڕای سیاسی یان گرووپی کۆمەڵایەتی ڕاوەدوو نراوە.\nسوبسیدیێر ئەو کەسەیە کە ڕاوەدوونانی کەسیی نەسەلماندووە، بەڵام لە وڵاتەکەی مەترسیی جدی وەک شەڕ، ئەشکەنجە یان لەسێدارەدان هەڕەشەی لێ دەکات.\nیەک: گەشت.\nپەنابەری جنێڤ پاسی شین وەردەگرێت و دەتوانێت بۆ هەموو وڵاتێک گەشت بکات جگە لە وڵاتی خۆی.\nسوبسیدیێر زۆرجار دەبێت پاسی وڵاتی خۆی هەبێت، و پاسی خۆڵەمێشی تەنها کاتێک دەدەن کە وەرگرتنی پاسی وڵاتەکەت مومکین نەبێت.\nدوو: هێنانی خێزان.\nپەنابەری جنێڤ ئەگەر لە ماوەی سێ مانگدا داواکاری بدات، مەرجی داهات و خانووی نییە.\nبۆ سوبسیدیێر، هێنانی خێزان تا جولای دوو هەزار و بیست و حەوت ڕاگیراوە، جگە لە حاڵەتە زۆر سەختەکان.\nسێ: ئیقامەی دائیمی.\nپەنابەری جنێڤ دوای سێ ساڵ بە زمانی C eins، یان دوای پێنج ساڵ بە A zwei و کار.\nسوبسیدیێر دوای پێنج ساڵ، بە مەرجە ئاساییەکان وەک B eins و کار.\nبەڵام چەند شتێک بۆ هەردووکیان وەک یەکە: ئیقامەی یەکەم سێ ساڵە.\nکارکردن بە تەواوی ئازادە.\nسێ ساڵی یەکەم زۆرجار دەبێت لەو هەرێمەدا بمێنیتەوە کە بۆت دیاری کراوە.\nو بۆ پاسپۆرتی ئەڵمانی، ماوەی دۆسیەی پەنابەرییش هەژمار دەکرێت.\nهەموو وردەکارییەکان لە وێب ئەپلیکەیشنی Wegweiser هەیە.\nلینکەکەی لە بایۆدایە.\nئێستا تۆ بڵێ، جنێڤیت یان سوبسیدیێر؟\nلە کۆمێنت بۆمان بنووسە.", "link_fa": "https://www.instagram.com/reel/Df2N3VvF3Nx/", "link_ku": "https://www.instagram.com/reel/DffXcFdk0w2/", "posted": "فارسی ✓ · کوردی ✓", "src": [], "c": "2026-10-22"},
{"id": "v-25-3-Abschiebungsverbot", "cat": "video", "t": "🎬 § 25 Abs. 3 (Abschiebungsverbot): 5 Dinge", "law": "§ 25 Abs. 3 AufenthG", "k": "25 3 Abschiebungsverbot § 25 Abs. 3 (Abschiebungsverbot): 5 Dinge", "one": "پناهندگی رد شد ولی Abschiebungsverbot گرفتی؟ 🛑 این ۵ چیز رو بدون!", "what": "پناهندگی رد شد ولی Abschiebungsverbot گرفتی؟ 🛑 این ۵ چیز رو بدون!\n📌 سیو کن و بفرست.\n💬 چند ساله ۲۵ بند ۳ داری؟\n\nمنبع: §§ 25 Abs. 3, 26, 29 AufenthG", "who": [], "dur": "", "ne": "", "pass": "", "travel": "", "tips": [], "cap_ku": "BAMF پەنابەرییەکەتی ڕەت کردووەتەوە، بەڵام Abschiebungsverbot ت وەرگرتووە؟ 🛑 ئەم ٥ شتە بزانە!\n📌 سەیڤی بکە و بنێرە.\n💬 چەند ساڵە ئیقامەی 25.3 ت هەیە؟\n\nسەرچاوە: §§ 25 Abs. 3, 26, 29 AufenthG", "script_fa": "روی کارت اقامتت نوشته fünfundzwanzig Absatz drei؟ پس این ویدیو مال توئه، چون آخرش یه نکته می‌گم که خیلی‌ها نمی‌دونن.\nاین قسمت سوم سری اقامت بیست و پنجه.\nAbsatz drei یعنی Abschiebungsverbot، یعنی ممنوعیت دیپورت.\nBAMF نه پناهندگی ژنو بهت داده، نه سوبسیدیر. فقط قبول کرده که نمی‌شه برت گردونن، مثلاً به خاطر یه بیماری سخت یا وضعیت خیلی بد کشورت.\nاز کجا بفهمی؟ روی کارتت، توی قسمت Anmerkungen، نوشته Paragraf fünfundzwanzig Absatz drei.\nتوی نامه‌ی BAMF هم نوشته Abschiebungsverbot nach Paragraf sechzig Absatz fünf یا Absatz sieben.\nاین اقامت حداقل یک ساله داده میشه و اجازه‌ی کار داری.\nمعمولاً باید پاس کشور خودت رو بگیری. پاس خاکستری فقط وقتی میدن که واقعاً نتونی پاس بگیری.\nآوردن همسر و بچه شدنیه، ولی سخته: درآمد کافی، خونه‌ی کافی، و معمولاً آلمانی A eins لازمه.\nاقامت دائم: بعد از پنج سال، با درآمد خودت، B eins و شصت ماه بیمه‌ی بازنشستگی. سال‌های پرونده‌ی پناهندگیت هم حساب میشه.\nو اون نکته‌ی مهم: با بیست و پنج سه مستقیم نمی‌تونی پاس آلمانی بگیری. اول باید اقامت دائم یا یه اقامت دیگه بگیری.\nیه چیز دیگه هم: اگه وضعیتت عوض بشه، مثلاً بیماریت خوب بشه، BAMF می‌تونه پرونده‌ت رو دوباره بررسی کنه.\nقسمت بعد: Absatz vier und fünf. فالو کن که از دستت نره، و لایک کن تا به بقیه هم برسه.\nکارت تو بیست و پنج سه هست؟ کامنت کن.", "script_ku": "لەسەر کارتی ئیقامەکەت نووسراوە fünfundzwanzig Absatz drei؟ کەواتە ئەم ڤیدیۆیە بۆ تۆیە، چونکە لە کۆتاییدا خاڵێک دەڵێم کە زۆر کەس نایزانێت.\nئەمە بەشی سێیەمی زنجیرەی ئیقامەی بیست و پێنجە.\nAbsatz drei واتە Abschiebungsverbot، واتە قەدەغەکردنی دیپۆرت.\nBAMF نە پەنابەری جنێڤی پێداویت، نە سوبسیدیێر. تەنها قبووڵی کردووە کە ناتوانن بتگەڕێننەوە، بۆ نموونە لەبەر نەخۆشییەکی قورس یان بارودۆخی زۆر خراپی وڵاتەکەت.\nچۆن بزانیت؟ لەسەر کارتەکەت، لە بەشی Anmerkungen، نووسراوە Paragraf fünfundzwanzig Absatz drei.\nلە نامەی BAMFیش نووسراوە Abschiebungsverbot nach Paragraf sechzig Absatz fünf یان Absatz sieben.\nئەم ئیقامەیە لانیکەم بۆ یەک ساڵ دەدرێت و مافی کارکردنت هەیە.\nزۆربەی کات دەبێت پاسپۆرتی وڵاتەکەی خۆت وەربگریت. پاسی خۆڵەمێشی تەنها کاتێک دەدەن کە بەڕاستی نەتوانیت پاسپۆرت وەربگریت.\nهێنانی هاوسەر و منداڵ دەکرێت، بەڵام قورسە: داهاتی تەواو، ماڵی گونجاو، و زۆربەی کات ئەڵمانی A eins پێویستە.\nئیقامەی دائیمی: دوای پێنج ساڵ، بە داهاتی خۆت، B eins و شەست مانگ بیمەی خانەنشینی. ساڵەکانی دۆسیەی پەنابەرییەکەشت حیساب دەکرێن.\nو ئەو خاڵە گرنگە: بە بیست و پێنج سێ ڕاستەوخۆ ناتوانیت پاسپۆرتی ئەڵمانی وەربگریت. سەرەتا دەبێت ئیقامەی دائیمی یان ئیقامەیەکی تر وەربگریت.\nشتێکی تریش: ئەگەر بارودۆخەکەت بگۆڕێت، بۆ نموونە نەخۆشییەکەت چاک ببێتەوە، BAMF دەتوانێت دۆسیەکەت دووبارە بپشکنێت.\nبەشی داهاتوو: Absatz vier und fünf. فۆڵۆ بکە بۆ ئەوەی لەدەستت نەچێت، و لایک بکە با بگات بە کەسانی تر.\nکارتی تۆ بیست و پێنج سێیە؟ کۆمێنت بکە.", "link_fa": "https://www.instagram.com/reel/Df4ye9cAFWx/", "link_ku": "", "posted": "فارسی ✓ · کوردی: در صف", "src": [], "c": "2026-11-07"},
{"id": "v-25-5", "cat": "video", "t": "🎬 § 25 Abs. 5 – Grenzen, Reiserisiko, Ausweg 25b", "law": "§ 25 Abs. 5 AufenthG", "k": "25 5 § 25 Abs. 5 – Grenzen, Reiserisiko, Ausweg 25b", "one": "روی کارتت 25.5 نوشته؟ ضعیف‌ترین اقامت آلمانه: لم‌شمل ممنوع، پاس مستقیم نه، و سفر به کشور خودت میتونه اقامتت رو از بین ببره. ولی یه راه فرار داره! سیو کن و برای کسی که 25.5 داره بفرست.", "what": "روی کارتت 25.5 نوشته؟ ضعیف‌ترین اقامت آلمانه: لم‌شمل ممنوع، پاس مستقیم نه، و سفر به کشور خودت میتونه اقامتت رو از بین ببره. ولی یه راه فرار داره! سیو کن و برای کسی که 25.5 داره بفرست.", "who": [], "dur": "", "ne": "", "pass": "", "travel": "", "tips": [], "cap_ku": "لەسەر کارتەکەت 25 Abs. 5 نووسراوە؟ ئەمە واتای چییە و دواتر چی دەبێت؟\n📌 سەیڤی بکە.\n💬 چەند ساڵە ئەم ئیقامەیەت هەیە؟\n\nسەرچاوە: §§ 25 Abs. 5, 26 Abs. 4 AufenthG", "script_fa": "", "script_ku": "ئیقامەی Paragraf fünfundzwanzig Absatz fünf هەیە؟ یان Duldungت هەیە و ناتوانیت بگەڕێیتەوە؟ ئەم ڤیدیۆیە بۆ تۆیە!\nفۆڵۆمان بکە و لایکێک بکە، با ئەم زانیارییە بگاتە هەمووان.\n25 Abs. 5 ئیقامەیە بۆ ئەو کەسانەی دەبێت ئەڵمانیا جێبهێڵن، بەڵام ناتوانن. بۆ نموونە لەبەر نەخۆشییەکی گەورە، یان چونکە وڵاتەکەیان وەریان ناگرێتەوە.\nگرینگترین خاڵ: ئەگەر هەژدە مانگ Duldungت هەبووە و هێشتا دیپۆرتکردن ناکرێت، بە پێی یاسا دەبێت ئەم ئیقامەیەت بدەنێ.\nبەڵام مەرجێکی گرینگ هەیە: دەبێت خۆت تاوانبار نەبیت. واتە درۆت لەسەر ناسنامە نەکردبێت، و هەموو هەوڵێکت دابێت بۆ پاسپۆرت.\nخاڵێکی گرینگ ماوە! سەیڤی ئەم ڤیدیۆیە بکە و لایکێک بکە تا پێت بڵێم.\nئیقامەکە سەرەتا بە زۆری بۆ شەش مانگە، دواتر دەکرێت تا سێ ساڵ بێت. دەتوانیت کار بکەیت.\nئیقامەی دائیمی: دوای پێنج ساڵ ئیقامە، و ساڵەکانی پرۆسەی پەنابەری حساب دەکرێن. پێویستت بە B1، Leben in Deutschland، و شەست مانگ Rentenversicherung هەیە.\nجنسیە: بە 25 Abs. 5 ڕاستەوخۆ نابێت. سەرەتا ئیقامەی دائیمی وەربگرە.\nئێستا تۆ بڵێ: چەند مانگە Duldungت هەیە؟ لە کۆمێنت بنووسە!", "link_fa": "https://www.instagram.com/reel/DfkTrqikvPg/", "link_ku": "https://www.instagram.com/reel/Dfhn9lNjj-t/", "posted": "فارسی ✓ · کوردی ✓", "src": [], "c": "2026-10-30"},
{"id": "v-Aufenthalt-25-5-a-b", "cat": "video", "t": "🎬 § 25 Abs. 5, 25a, 25b im Vergleich", "law": "§ 25 Abs. 5, 25a, 25b", "k": "Aufenthalt 25 5 a b § 25 Abs. 5, 25a, 25b im Vergleich", "one": "پناهندگیت رد شده؟ هنوز ۳ راه برای اقامت هست: § 25 Abs. 5، § 25a و § 25b. ببین کدوم مال توئه 📌", "what": "پناهندگیت رد شده؟ هنوز ۳ راه برای اقامت هست: § 25 Abs. 5، § 25a و § 25b. ببین کدوم مال توئه 📌", "who": [], "dur": "", "ne": "", "pass": "", "travel": "", "tips": [], "cap_ku": "پەنابەرییەکەت ڕەفز کرا؟ هێشتا ٣ ڕێگا هەیە: § 25 Abs. 5، § 25a و § 25b. ببینە کامیان بۆ تۆیە 📌", "script_fa": "", "script_ku": "", "link_fa": "https://www.instagram.com/reel/DfenX1qDQJQ/", "link_ku": "https://www.instagram.com/reel/DfhTffTk8Vy/", "posted": "فارسی ✓ · کوردی ✓", "src": [], "c": "2026-10-18"},
