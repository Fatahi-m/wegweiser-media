 tips:["BAMF از همان موقع دیگر Familienasyl نمی‌دهد، حتی برای پرونده‌های باز قبل از 12.06.2026.","اول دلایل خود شخص بررسی می‌شود؛ اگر رد شد، همزمان Art. 23 چک می‌شود و Abschiebungsandrohung صادر نمی‌شود.","تأیید § 26 Abs. 2 در برگه‌ی جداگانه می‌آید، نه در برگه‌ی رد.","همسر کسی که 25b یا اقامت غیر پناهندگی دارد شامل این نیست.","جواب‌های قدیمی که «§ 26 AsylG همان اقامت همسر» می‌گفتند دیگر دقیق نیستند.","نگهبان قانون 18.11.2026: §§ 73, 73a AsylG قدیم حذف شده؛ Widerruf/Rücknahme حالا طبق §§ 72, 73b AsylG. انتقالی § 87e Abs. 2/3 AsylG از 01.10.2026 حذف شد (BGBl. 2026 I Nr. 221). Widerruf اعضای خانواده دیگر خودکار نیست؛ فقط با «Wegfall der Umstände» طبق StatusVO.","خانواده باید قبل از ورود به خاک آلمان/EU وجود داشته باشد (Art. 3 Nr. 9 StatusVO). نوع دقیق اقامت (§ 25 Abs. 1/2؟) و مدتش هنوز تأیید نشده."],

 tips:["آوردن خانواده با 16d ممکن ولی سخت (خرج کل خانواده). بعد از قبولی و § 18a آسان‌تر؛ برای همسر Fachkraft زبان لازم نیست.","معافیت زبان همسر برای خودِ 16d چک نشده.","مورد omar: سفارت گفته «مدارکت را ببر» → احتمالاً رد (نبود A1 یا درآمد ناکافی). دلیل رد را کتبی بخواهد؛ اعتراض: Klage در VG Berlin ظرف ۱ ماه؛ اغلب بهتر: درخواست جدید بعد از § 18a.","آپدیت omar (22.10.2026): نامه‌ی رد از کنسولگری اربیل به تاریخ 06.10.2026 (درخواست 22.01.2026). دلایل: ۱) مدرک A1 با وجود چند بار مهلت نداده (§ 30 Abs. 1 S. 1 Nr. 2)، ۲) Einzelfall/هارت‌فال طبق § 30 Abs. 1 S. 3 Nr. 6 نیست، ۳) Ausländerbehörde موافقت § 31 AufenthV را نداد. راه: A1 بگیرد و دوباره درخواست بدهد؛ یا بعد از § 18a همسر (امتحان 10.01.2027)؛ Klage در VG Berlin ظرف ۱ ماه از دریافت (اگر Rechtsbehelfsbelehrung ندارد ۱ سال، § 58 VwGO)، شانس کم چون A1 نداده.","درآمد لازم: عدد ثابت ندارد — Netto باید بیشتر از نیاز کل خانواده باشد (Regelbedarfe + اجاره‌ی گرم + بیمه)، بدون Jobcenter."],

const $=s=>document.querySelector(s);
const norm=s=>(s||"").toString().toLowerCase().replace(/<[^>]+>/g," ").replace(/[ي]/g,"ی").replace(/[ك]/g,"ک").replace(/[ۀة]/g,"ه").replace(/[ً-ْ‌]/g,"").replace(/§/g," ").replace(/abs\.?/g,"abs ").replace(/[.\-()،,/]/g," ").replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ß/g,"ss").replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\s+/g," ").trim();
D.forEach(d=>{d._hay=norm([d.t,d.law,d.k,d.one,d.what,(d.who||[]).join(" "),d.dur,d.ne,d.pass,d.travel,(d.tips||[]).join(" ")].join(" "));d._head=norm([d.t,d.law,d.k].join(" "));});
let cat="all";
const chips=$("#chips");
CATS.forEach(([id,label])=>{const b=document.createElement("button");b.type="button";b.textContent=label;b.dataset.id=id;b.setAttribute("aria-pressed",id==="all");b.onclick=()=>{cat=id;[...chips.children].forEach(x=>x.setAttribute("aria-pressed",x.dataset.id===id));render();};chips.appendChild(b);});
const esc=s=>s;
function row(h,v){if(!v||v==="—")return"";return `<div class="row"><h3>${h}</h3><p>${v}</p></div>`;}
function list(h,a){if(!a||!a.length)return"";return `<div class="row"><h3>${h}</h3><ul>${a.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;}
function card(d,open){
  const src=(d.src||[]).map(([l,u])=>`<a href="${u}" target="_blank" rel="noopener">${l}</a>`).join(" · ");
  return `<details class="card" id="${d.id}" ${open?"open":""}><summary><span class="t">${d.t}</span><span class="law">${d.law}</span><span class="one">${d.one}</span></summary>
  <div class="body">${row("چیه",d.what)}${list("کی و با چه شرطی",d.who)}${row("مدت و کار",d.dur)}${row("اقامت دائم",d.ne)}${row("پاسپورت آلمانی",d.pass)}${row("سفر",d.travel)}
  ${d.tips&&d.tips.length?`<div class="row tip"><h3>نکته‌ها و سؤال‌های پرتکرار</h3><ul>${d.tips.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:""}
  <div class="meta"><span>چک‌شده: ${d.c}</span>${src?`<span>منبع: ${src}</span>`:""}</div></div></details>`;
}
function render(){
  const q=norm($("#q").value);$("#clear").hidden=!q;
  const terms=q?q.split(" "):[];
  let res=D.filter(d=>(cat==="all"||d.cat===cat)&&terms.every(t=>d._hay.includes(t)));
  if(q){res.sort((a,b)=>(b._head.includes(q)?2:terms.every(t=>b._head.includes(t))?1:0)-(a._head.includes(q)?2:terms.every(t=>a._head.includes(t))?1:0));}
  $("#count").textContent=res.length?`${res.length} موضوع`+(q?` برای «${$("#q").value}»`:""):"";
  $("#list").innerHTML=res.length?res.map((d,i)=>card(d,q&&i===0)).join(""):`<div class="empty">چیزی پیدا نشد. اسم آلمانی یا شماره‌ی ماده را امتحان کن، مثلاً «60d» یا «Gestattung».</div>`;
}
$("#q").addEventListener("input",render);
$("#clear").onclick=()=>{$("#q").value="";render();$("#q").focus();};
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement!==$("#q")){e.preventDefault();$("#q").focus();}if(e.key==="Escape"){$("#q").value="";render();}});
render();
if(location.hash){const el=document.getElementById(location.hash.slice(1));if(el){el.open=true;el.scrollIntoView();}}
</script>
